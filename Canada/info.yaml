  paid_activity_preferences:

    intended_paid_activities:

      - wildlife_safari

    possible_second_paid_activity:

      - helicopter_flight

      - whitewater_rafting

      - horseback_riding

    planning_note: >
      Wildlife encounters, hiking and viewpoints already provide most of the value.
      A helicopter flight is probably the ultimate once-in-a-lifetime paid activity.

  wildlife_expectations:

    commonly_seen:

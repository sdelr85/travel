trip:
  country: Canada

  overview:
    rank: 4
    summary: "15-day family fly-in self-drive trip through the Canadian Rockies, focused on mountains, turquoise lakes, wildlife, hiking, waterfalls and scenic drives."
    summary_reason: >
      The ultimate mix of alpine scenery, turquoise lakes, wildlife encounters, hiking and one of the world's greatest self-drive routes.

    transport: "✈ Plane + 🚗 Rental car"

    duration_days: 15
    duration_nights: 14

    travel_style: "Fly-in family self-drive"

    highlights:
      - "Banff National Park"
      - "Lake Louise"
      - "Moraine Lake"
      - "Icefields Parkway"
      - "Jasper National Park"
      - "Yoho National Park"
      - "Kananaskis Country"
      - "Emerald Lake"
      - "Athabasca Glacier"
      - "Canadian wildlife"

    target_group:
      adults: 2
      children: 3

  direction: calgary_banff_jasper_yoho_kananaskis

  duration:

    days: 15
    nights: 14

    base_locations: 4

    recommended_base_split:

      - base: base_1
        nights: 5

      - base: base_2
        nights: 4

      - base: base_3
        nights: 3

      - base: base_4
        nights: 2

  transport_constraints:

    rental_car:
      strongly_recommended: true

    long_distance_flights:
      required: true

    wildlife:
      note: >
        Bears, elk, bighorn sheep and mountain goats are common.
        Maintain safe distances at all times.

  planning_principles:

    lodging_strategy:
      note: >
        Use Banff, Jasper, Golden and Kananaskis as strategic bases.
        This minimizes accommodation changes while maximizing hiking time.

    transfer_day:
      max_recommended_major_stops: 3
      max_recommended_sightseeing_hours: 4

    base_day:
      max_recommended_single_drive_minutes: 90

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  access_plan:

    from: Belgium

    by: plane

    airport:

      id: calgary_airport

      name: Calgary International Airport

      coordinates:
        lat: 51.1139
        lon: -114.0203


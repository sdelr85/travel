trip:
  country: Canada

  overview:
    rank: 5
    summary: "15-daagse familie-autoreis door de Canadese Rockies, gericht op bergen, turquoise meren, wildlife, wandelen, watervallen en onverwacht rijden."
    summary_reason: >-
      De Canadese Rockies leveren de meest iconische combinatie van turquoise gletsjermeren, hoge pieken, hanggletsjers en langs-de-weg-wildlife ter wereld. Banff, Jasper en de Icefields Parkway zijn gecombineerde wereldklasse — het soort landschap dat je halverwege de rit stopt. Anders dan Noorwegen uit Nieuw-Zeeland maakt de enorme hoeveelheid van onmisbare hoogtepunten op één enkele autoreis het bijna onbeperkt verbruikt.

    transport: "✈ Vliegtuig + 🚗 Huurauto"

    duration_days: 15
    duration_nights: 14

    travel_style: "Fly-in familie-selfdrive"

    highlights:
    - Banff Nationaal Park
    - Meer Louise
    - Moraine-meer
    - IJsvelden Parkway
    - Jasper Nationaal Park
    - Yoho Nationaal Park
    - Kananaskis-land
    - Smaragdgroen Meer
    - Athabasca-gletsjer
    - Canadese dieren in het wild
    cost:
      couple:
        eur_range: "€6,000 - €9,000"
      family:
        eur_range: "€10,000 - €16,000"
      relative_costs: "high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: calgary_banff_jasper_yoho_kananaskis

  duration:

    days: 15
    nights: 14

    base_locations: 4

    recommended_base_split:

    - base: base_1
      nights: 5

    - base: base_2
      nights: 4

    - base: base_3
      nights: 3

    - base: base_4
      nights: 2

  transport_constraints:

    rental_car:
      strongly_recommended: true

    long_distance_flights:
      required: true

    wildlife:
      note: >-
        Beren, elanden, dikhoornschapen en berggeiten komen veel voor. Houd te allen tijde veilige afstanden aan.

  planning_principles:

    lodging_strategy:
      note: >-
        Gebruik Banff, Jasper, Golden en Kananaskis als strategische bases. Dit minimaliseert het veranderen van accommodatie en maximaliseert de wandeltijd.

    transfer_day:

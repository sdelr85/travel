      type: mountain_viewpoint

      visit_duration_hours: 3

      coordinates:
        lat: 42.6625
        lon: 44.6200

    - id: gergeti_glacier

      name: Gergeti-gletsjerroute

      priority: must_do

      type: mountain_hike

      visit_duration_hours: 6

      coordinates:
        lat: 42.7220
        lon: 44.5600

    - id: truso_valley

      name: Truso-vallei

      priority: must_do

      type: valley_hike

      visit_duration_hours: 5

      coordinates:
        lat: 42.6070
        lon: 44.3630

    - id: sno_valley

      name: Sno-vallei

      priority: highly_recommended

      type: scenic_valley

      visit_duration_hours: 2

      coordinates:
        lat: 42.6060
        lon: 44.6330

    - id: military_highway

      name: Georgische militaire snelweg

      priority: must_do

      type: scenic_drive

      visit_duration_hours: 3

      coordinates:
        lat: 42.5040
        lon: 44.5560

  - id: base_3

    name: Kakheti

    region: Wijnstreek

    stay_nights: 3

    coordinates:
      lat: 41.9198
      lon: 45.4730

    base_attractions:

    - id: sighnaghi

      name: Signagi

      priority: must_do

      type: hill_town

      visit_duration_hours: 3

      coordinates:
        lat: 41.6200
        lon: 45.9230

    - id: alaverdi

      name: Het Alaverdi-klooster

      priority: highly_recommended

      type: monastery

      visit_duration_hours: 1

      coordinates:
        lat: 42.0320
        lon: 45.3770

    - id: kakheti_wineries

      name: Kakheti-wijngaarden

      priority: highly_recommended

      type: scenic_drive


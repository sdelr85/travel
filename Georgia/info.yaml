      type: glacier_hike

      visit_duration_hours: 4

      coordinates:
        lat: 43.0670
        lon: 42.6990

    - id: koruldi

      name: Koruldi-meren

      priority: must_do

      type: alpine_hike

      visit_duration_hours: 5

      coordinates:
        lat: 43.0820
        lon: 42.7280

    - id: mestia_towers

      name: Svan-torens van Mestia

      priority: highly_recommended

      type: cultural_site

      visit_duration_hours: 2

      coordinates:
        lat: 43.0458
        lon: 42.7278

    - id: hatsvali

      name: Hatsvali-uitkijkpunt

      priority: highly_recommended

      type: mountain_viewpoint

      visit_duration_hours: 2

      coordinates:
        lat: 43.0530
        lon: 42.7000

  transfer_routes:

  - id: transfer_tbilisi_to_kazbegi

    from: base_1
    to: base_2

    description: Van Tbilisi naar Kazbegi

    estimated_direct_drive_hours: 3.5

    en_route_candidates:

    - id: ananuri

      name: Ananuri-fort

      priority: must_do

      type: fortress

      stop_duration_hours: 1

      coordinates:
        lat: 42.1630
        lon: 44.7030

    - id: gudauri

      name: Gudauri-uitkijkpunt

      priority: highly_recommended

      type: viewpoint

      stop_duration_hours: 1

      coordinates:
        lat: 42.4700
        lon: 44.4800

  - id: transfer_kazbegi_to_kakheti

    from: base_2
    to: base_3

    description: Kazbegi naar Kakheti

    estimated_direct_drive_hours: 4.5

  - id: transfer_kakheti_to_mestia

    from: base_3
    to: base_4

    description: Kakheti naar Mestia

    estimated_direct_drive_hours: 6.5

    planning_note: >-
      Langste overstap van de reis. Overweeg indien gewenst een stop in Kutaisi.

  paid_activity_preferences:

    intended_paid_activities:
    - horse_riding_svaneti
    possible_second_paid_activity:
    - wine_tasting
    planning_note: >-
      De meeste hoogtepunten zijn gratis wandelingen en uitzichtpunten. Georgië vereist niet veel betaalde activiteiten.

  excluded_or_future_trip_options:

    batumi:
      reason: >
        Popular but less aligned with a mountain-focused trip.

    tusheti:
      reason: >
        Incredible area but requires more time and more demanding roads.

    borjomi:
      reason: >
        Nice region but lower priority than Kazbegi and Svaneti.

    black_sea_coast:
      reason: >
        Less spectacular than the Caucasus mountain regions.

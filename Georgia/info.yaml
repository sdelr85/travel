trip:

  country: Georgia

  overview:
    rank: 18

    summary: >-
      15-daagse familie-autoreis door Georgië, met een combinatie van de Kaukasus, afgelegen dorpen, magische wegen, wijnstreken en wandellandschappen.

    summary_reason: >-
      Georgië is een van Europa's beste bewaarde geheimen — oude grotensteden, verplichte torendorpen in de Kaukasische hooglanden, een wilde berggrens die dichter bij Centraal-Azië zichtbaar dan bij West-Europa, en een eet- en wijncultuur die geheel eigen is. Voor een fractie van de kosten van de Alpiene of Scandinavische bestemmingen biedt het spectaculaire berglandschap, echt avontuur en een culturele rijkdom die maar weinig andere reizen op deze lijst kunnen evenaren.

    transport: "✈ Vliegtuig + 🚗 Huurauto"

    duration_days: 15
    duration_nights: 14

    travel_style: Fly-in familie-selfdrive

    highlights:
    - Tbilisi
    - Georgische Heerweg
    - Kazbegi
    - Gergeti Drievuldigheidskerk
    - Truso-vallei
    - Kakheti Wijnstreek
    - Mestia
    - Ushguli
    - Svaneti
    - Kaukasus
    cost:
      couple:
        eur_range: "€3,000 - €5,000"
      family:
        eur_range: "€5,000 - €8,000"
      relative_costs: "low"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: east_to_west

  duration:

    days: 15
    nights: 14

    base_locations: 4

    recommended_base_split:

    - base: base_1
      nights: 3

    - base: base_2
      nights: 4

    - base: base_3
      nights: 3

    - base: base_4
      nights: 4

  transport_constraints:

    rental_car:
      strongly_recommended: true

    vehicle:
      recommended: suv

    mountain_roads:
      note: >-
        De wegen in Svaneti en afgelegen berggebieden kunnen ruig zijn. De rijsnelheden zijn doorgaans lager dan verwacht.

  planning_principles:

    lodging_strategy:
      note: >-
        Georgië combineert berglandschap, cultuur en geschiedenis. Gebruik een beperkt aantal basissen om onnodig inpakken te voorkomen.

    transfer_day:
      max_recommended_major_stops: 2

    base_day:
      max_recommended_single_drive_minutes: 90

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  airport:

    id: tbilisi_airport

    name: Internationale luchthaven van Tbilisi

    coordinates:
      lat: 41.6692
      lon: 44.9547

  lodging_locations:

  - id: base_1

    name: Tbilisi

    region: Oost-Georgië

    stay_nights: 3

    coordinates:
      lat: 41.7151
      lon: 44.8271

    base_attractions:

    - id: old_tbilisi

      name: Oud Tbilisi

      priority: must_do

      type: city_walk

      visit_duration_hours: 3

      coordinates:
        lat: 41.6907
        lon: 44.8078

    - id: narikala

      name: Het Narikala-fort

      priority: highly_recommended

      type: viewpoint

      visit_duration_hours: 1

      coordinates:
        lat: 41.6879
        lon: 44.8098

    - id: chronicles

      name: Kronieken van Georgië

      priority: highly_recommended

      type: monument

      visit_duration_hours: 1

      coordinates:
        lat: 41.7700
        lon: 44.8100

    - id: mtatsminda

      name: Mtatsminda Park-uitkijkpunt

      priority: if_time

      type: viewpoint

      visit_duration_hours: 2

      coordinates:
        lat: 41.6940
        lon: 44.7860

  - id: base_2

    name: Kazbegi / Stepantsminda

    region: Grotere Kaukasus

    stay_nights: 4

    coordinates:
      lat: 42.6560
      lon: 44.6430

    base_attractions:

    - id: gergeti

      name: Drievuldigheidskerk van Gergeti


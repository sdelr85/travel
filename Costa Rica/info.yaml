trip:

  country: Costa Rica

  overview:
    rank: 11

    summary: >-
      15-daagse familie-autoreis door Costa Rica, met een combinatie van gebroken, vulkanen, wildlife, watervallen, stranden, snorkelen en avontuurlijke activiteiten.

    summary_reason: >-
      Costa Rica is de enige bestemming op deze lijst waar je in één week zeeschildpadden nesten op een strand kunt zien, 's ochtends door wolkenbos kunt wandelen, luiaards en toekans langs de weg kunt spotten en op de rand van een actieve vulkaankrater kunt staan. Het is het meest compacte en gezinsvriendelijke tropische avontuur dat er is — een land dat biodiversiteit en ecotoerisme tot een kunstvorm heeft verheven, met wildlifemomenten die natuurlijke en ontspannen chaos op de plaats van geensceneerd.

    transport: "✈ Vliegtuig + 🚗 Huurauto"

    duration_days: 15
    duration_nights: 14

    travel_style: Fly-in familie-selfdrive

    highlights:
    - Arenal Vulkaan
    - La Fortuna Waterval
    - Hangbruggen
    - Luiaards en apen
    - Rio Celeste
    - Monteverde Wolkenbos
    - Ziplinen
    - Tortuguero
    - Zeeschildpadden
    - Manuel Antonio
    - Snorkelen
    - Stille Oceaan stranden
    cost:
      couple:
        eur_range: "€5,000 - €9,000"
      family:
        eur_range: "€9,000 - €15,000"
      relative_costs: "high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: central_volcanoes_to_pacific

  duration:

    days: 15
    nights: 14

    base_locations: 5

    recommended_base_split:

    - base: base_1
      nights: 3

    - base: base_2
      nights: 3

    - base: base_3
      nights: 2

    - base: base_4
      nights: 3

    - base: base_5
      nights: 3

  transport_constraints:

    rental_car:
      strongly_recommended: true

    road_conditions:
      note: >-
        De wegen zijn over het algemeen goed, maar bergwegen kunnen langzaam zijn. De afstanden zijn kort, maar de reistijden zijn vaak langer dan verwacht.

    wildlife:
      note: >-
        Waarnemingen van dieren in het wild vormen een kernonderdeel van de ervaring. Neem waar mogelijk een verrekijker mee.

  planning_principles:

    lodging_strategy:
      note: >-
        Gebruik een beperkt aantal bases en vermijd elke dag bewegen. Costa Rica werkt het beste als het regenwoud, vulkanen en kust combineert.

    transfer_day:
      max_recommended_major_stops: 2

    base_day:
      max_recommended_single_drive_minutes: 90

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  airport:

    id: san_jose_airport

    name: Internationale luchthaven Juan Santamaria

    coordinates:
      lat: 9.9981
      lon: -84.2041

  lodging_locations:

  - id: base_1

    name: La Fortuna/Arenal

    region: Noordelijke Hooglanden

    stay_nights: 3

    coordinates:
      lat: 10.4717
      lon: -84.6450

    planning_note: >-
      Beste vulkaan- en avonturenbasis in Costa Rica.

    base_attractions:

    - id: arenal_volcano

      name: Arenal-vulkaan

      priority: must_do

      type: volcano

      visit_duration_hours: 3

      coordinates:
        lat: 10.4636
        lon: -84.7039

    - id: la_fortuna_waterfall

      name: La Fortuna-waterval

      priority: must_do

      type: waterfall

      visit_duration_hours: 2

      coordinates:
        lat: 10.4710
        lon: -84.6450

    - id: mistico_hanging_bridges

      name: Mistico Hangbruggen

      priority: must_do

      type: rainforest_walk

      visit_duration_hours: 3

      coordinates:
        lat: 10.5002
        lon: -84.7550

    - id: arenal_hot_springs

      name: Arenal-warmwaterbronnen

      priority: highly_recommended

      type: thermal_pool

      visit_duration_hours: 3

      coordinates:
        lat: 10.4970
        lon: -84.6980

    - id: sloth_trail

      name: Luiaardpad

      priority: highly_recommended

      type: wildlife

      visit_duration_hours: 2

      coordinates:
        lat: 10.4730
        lon: -84.6420

    - id: zipline_arenal

      name: Arenal-zipline

      priority: optional_paid_activity

      type: adventure

      visit_duration_hours: 3

      coordinates:
        lat: 10.5350
        lon: -84.6950

  - id: base_2

    name: Monteverde

    region: Nevelwoud

    stay_nights: 3

    coordinates:
      lat: 10.3000
      lon: -84.8160

    planning_note: >-
      Uniek nevelwoud-ecosysteem en een van de beste natuurgebieden van Costa Rica.

    base_attractions:

    - id: monteverde_cloud_forest

      name: Monteverdenevelwoud

      priority: must_do

      type: cloud_forest

      visit_duration_hours: 4

      coordinates:
        lat: 10.3050
        lon: -84.8000

    - id: santa_elena_cloud_forest

      name: Santa Elena-reservaat

      priority: highly_recommended

      type: cloud_forest

      visit_duration_hours: 3

      coordinates:
        lat: 10.3230
        lon: -84.8060

    - id: hanging_bridges_monteverde

      name: Hangbruggen van Monteverde

      priority: highly_recommended

      type: rainforest_walk

      visit_duration_hours: 3

      coordinates:
        lat: 10.3180
        lon: -84.8220

    - id: hummingbird_gallery

      name: Kolibrietuin

      priority: highly_recommended

      type: wildlife

      visit_duration_hours: 1

      coordinates:
        lat: 10.3070
        lon: -84.7950

    - id: zipline_monteverde

      name: Monteverde Canopy-tour

      priority: optional_paid_activity

      type: adventure

      visit_duration_hours: 3

      coordinates:
        lat: 10.3000
        lon: -84.8200

  - id: base_3

    name: Tenorio/Rio Celeste

    region: Noord-Costa Rica

    stay_nights: 2

    coordinates:
      lat: 10.7350
      lon: -85.0140

    base_attractions:

    - id: rio_celeste

      name: Rio Celeste

      priority: must_do

      type: waterfall_hike

      visit_duration_hours: 4

      coordinates:
        lat: 10.7060
        lon: -84.9910

    - id: tenorio_national_park

      name: Tenorio Nationaal Park

      priority: highly_recommended

      type: rainforest_hike

      visit_duration_hours: 4

      coordinates:
        lat: 10.7420
        lon: -84.9940

  - id: base_4

    name: Tortuguero

    region: Caribische kust

    stay_nights: 3

    coordinates:
      lat: 10.5410
      lon: -83.5020

    planning_note: >-
      Beste natuurregio en een van de beste bestemmingen voor zeeschildpadden.

    base_attractions:

    - id: tortuguero_canals

      name: Tortuguero-kanalen

      priority: must_do

      type: wildlife_boat_trip

      visit_duration_hours: 4

      coordinates:
        lat: 10.5410
        lon: -83.5020

    - id: sea_turtles

      name: Zeeschildpadden kijken

      priority: must_do

      type: wildlife

      visit_duration_hours: 3

      coordinates:
        lat: 10.5400
        lon: -83.5040

    - id: tortuguero_village

      name: Tortuguero-dorp

      priority: if_time

      type: village

      visit_duration_hours: 2

      coordinates:
        lat: 10.5430
        lon: -83.5030

  - id: base_5

    name: Manuel Antonio

    region: Pacifische kust

    stay_nights: 3

    coordinates:
      lat: 9.4120
      lon: -84.1550

    planning_note: >-
      Combineert regenwoud, dieren in het wild, stranden en snorkelen.

    base_attractions:

    - id: manuel_antonio_np

      name: Manuel Antonio Nationaal Park

      priority: must_do

      type: rainforest_beach

      visit_duration_hours: 5

      coordinates:
        lat: 9.3920
        lon: -84.1540

    - id: manuel_antonio_beach

      name: Manuel Antonio-strand

      priority: must_do

      type: beach

      visit_duration_hours: 3

      coordinates:
        lat: 9.3880
        lon: -84.1680

    - id: monkey_viewing

      name: Apenkijkgebieden

      priority: highly_recommended

      type: wildlife

      visit_duration_hours: 2

      coordinates:
        lat: 9.3950
        lon: -84.1600

    - id: snorkeling_tour

      name: Snorkeltocht

      priority: highly_recommended

      type: snorkeling

      visit_duration_hours: 4

      coordinates:
        lat: 9.3900
        lon: -84.1700

    - id: turtle_snorkeling

      name: Snorkelen met zeeschildpadden

      priority: highly_recommended

      type: snorkeling_wildlife

      visit_duration_hours: 4

      coordinates:
        lat: 9.3900
        lon: -84.1700

  transfer_routes:

  - id: transfer_airport_to_base_1

    from: san_jose_airport
    to: base_1

    description: San Jose naar Arenal

    estimated_direct_drive_hours: 3

  - id: transfer_base_1_to_base_2

    from: base_1
    to: base_2

    description: Arenal naar Monteverde

    estimated_direct_drive_hours: 3

  - id: transfer_base_2_to_base_3

    from: base_2
    to: base_3

    description: Monteverde naar Rio Celeste

    estimated_direct_drive_hours: 3

  - id: transfer_base_3_to_base_4

    from: base_3
    to: base_4

    description: Rio Celeste naar Tortuguero

    estimated_direct_drive_hours: 5

  - id: transfer_base_4_to_base_5

    from: base_4
    to: base_5

    description: Tortuguero aan Manuel Antonio

    estimated_direct_drive_hours: 5

  paid_activity_preferences:

    intended_paid_activities:
    - turtle_snorkeling
    possible_second_paid_activity:
    - zipline_arenal
    possible_third_paid_activity:
    - zipline_monteverde
    planning_note: >-
      Voor gezinnen zijn snorkelen met zeeschildpadden en op dieren gerichte activiteiten unieker dan adrenaline-activiteiten.

  wildlife_expectations:

    commonly_seen:
    - sloth
    - monkey
    - toucan
    - iguana
    - sea_turtle
    possible:
    - crocodile
    - dolphin
    - whale
    safety_note: >
      Wildlife encounters are usually safe when observing from a distance.
      Do not feed wildlife.

  excluded_or_future_trip_options:

    osa_peninsula:
      reason: >
        One of the most biodiverse areas on Earth but requires additional
        travel time and is better suited to an extended Costa Rica trip.

    rincon_de_la_vieja:
      reason: >
        Excellent volcanic region but lower priority for a first family trip.

    caribbean_south:
      reason: >-
        Better combined with a longer wildlife-focused itinerary.

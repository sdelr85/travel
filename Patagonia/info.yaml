trip:
  country: Patagonia

  overview:
    rank: 2
    summary: >-
      17-daagse familie-autoreis door de meest spectaculaire gebieden van Zuid-Patagonë, met Argentinië en Chili gecombineerd. Gericht op gletsjers, iconische berglandschappen, wildlife, wandelen, magische ritten en nationale parken.

    summary_reason: >-
      Patagonë ​​is waar de Andes instorten tot getande granieten naalden, oude gletsjers kalven in melkblauwe meren en de wind zo hevig is dat hij het land zelf vormt. Torres del Paine, Fitz Roy en gletsjer Perito Moreno bevinden zich op een andere visuele schaal dan alles in Europa – monumentaal, elementair en volkomen onvergetelijk. Voor een gezin dat een echt einde-van-de-wereld-grootsheid wil beleven, is er ergens een plek die gelijkaardig is.

    transport: "✈ Vliegtuig + 🚗 Huurauto"

    duration_days: 17
    duration_nights: 16

    travel_style: Fly-in familie-selfdrive

    highlights:
    - Gletsjer Perito Moreno
    - El Chalten
    - Fitz-Roy
    - Laguna de los Tres
    - Laguna Torre
    - Torres del Paine
    - Mirador Las Torres
    - Grijze Gletsjer
    - Salto Grande
    - Guanaco's en condors
    cost:
      couple:
        eur_range: "€6,000 - €10,000"
      family:
        eur_range: "€10,000 - €17,000"
      relative_costs: "very_high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: argentina_then_chile

  duration:

    days: 17
    nights: 16

    base_locations: 4

    recommended_base_split:

    - base: base_1
      nights: 4

    - base: base_2
      nights: 5

    - base: base_3
      nights: 5

    - base: base_4
      nights: 2

  transport_constraints:

    rental_car:
      strongly_recommended: true

    border_crossing:
      required: true

    weather_flexibility:
      required: true
      note: >-
        Het weer in Patagonië verandert snel. De wind kan extreem zijn en de routeplannen moeten flexibel blijven.

  planning_principles:

    lodging_strategy:
      note: >-
        Gebruik El Calafate, El Chalten, Torres del Paine en Puerto Natales als basis. Dit minimaliseert het rijden en maximaliseert de wandeltijd.

    transfer_day:
      max_recommended_major_stops: 2
      max_recommended_sightseeing_hours: 4

    base_day:
      max_recommended_single_drive_minutes: 90

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  airports:

    arrival_airport:
      id: el_calafate_airport
      name: Luchthaven El Calafate

      coordinates:
        lat: -50.2803
        lon: -72.0531

    departure_airport:
      id: puerto_natales_airport
      name: Luchthaven Puerto Natales

      coordinates:
        lat: -51.6714
        lon: -72.5284

  lodging_locations:

  - id: base_1

    name: El Calafate

    region: Nationaal park Los Glaciares

    stay_nights: 4

    coordinates:
      lat: -50.3379
      lon: -72.2648

    planning_note: >-
      Belangrijkste gletsjerbasis en aankomstpunt voor de reis.

    base_attractions:

    - id: perito_moreno

      name: Perito Moreno-gletsjer

      priority: must_do

      type: glacier

      visit_duration_hours: 5

      coordinates:
        lat: -50.4950
        lon: -73.0485

      visit_strategy:
        primary_base: base_1

        notes: >-
          Eén van de meest indrukwekkende gletsjers ter wereld en de belangrijkste reden om El Calafate te bezoeken.

    - id: glacier_walkways

      name: Perito Moreno-loopbruggen

      priority: must_do

      type: glacier_viewpoint

      visit_duration_hours: 3

      coordinates:
        lat: -50.4960
        lon: -73.0480

    - id: navegacion_glaciares

      name: Gletsjerbootnavigatie

      priority: highly_recommended

      type: boat_trip

      visit_duration_hours: 3

      coordinates:
        lat: -50.4950
        lon: -73.0485

    - id: laguna_nimez

      name: Laguna Nimez

      priority: highly_recommended

      type: wildlife_walk

      visit_duration_hours: 2

      coordinates:
        lat: -50.3343
        lon: -72.2525

    - id: el_calafate_town

      name: El Calafate

      priority: if_time

      type: town

      visit_duration_hours: 2

      coordinates:
        lat: -50.3379
        lon: -72.2648

    arrival_day_candidates:


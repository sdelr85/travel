    from: base_1
    to: base_2

    description: Van El Calafate naar El Chalten

    estimated_direct_drive_hours: 3

    max_recommended_major_stops: 2

    en_route_candidates:

    - id: ruta_40_viewpoints

      name: Ruta 40 schilderachtige stops

      priority: highly_recommended

      type: scenic_drive

      stop_duration_hours: 1

      coordinates:
        lat: -49.8500
        lon: -72.6500

  - id: transfer_base_2_to_base_3

    from: base_2
    to: base_3


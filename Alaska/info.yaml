trip:
  country: Alaska

  overview:
    rank: 9
    summary: "16-daagse familie-autoreis door Centraal-Alaska, gericht op wildlife, gletsjers, fjorden, bergen en spectaculaire wildernis."
    summary_reason: >-
      Alaska is de laatste grote Amerikaanse wildernis — een plek waar grizzlyberen langs de weg vissen, bultruggen opspringen in door gletsjers gesneden fjorden en Denali uittorent boven al het andere op het continent. Anders dan Canada in Nieuw-Zeeland is de schaal hier overweldigend: Kenai Fjords, Exit Glacier en het Denali National Park bieden een ruwe, ongetemperde ervaring die geen enkele andere autobestemming kan evenaren.
    transport: "✈ Vliegtuig + 🚗 Huurauto"
    duration_days: 16
    travel_style: "Fly-in familie-selfdrive"
    highlights:
    - Kenai Fjorden Nationaal Park
    - Denali Nationaal Park
    - Verlaat Gletsjer
    - Walvissen gespot
    - Beren waarnemers
    - Matanuska-gletsjer
    - Talkeetna en uitkijkpunten over Denali
    cost:
      couple:
        eur_range: "€7,000 - €11,000"
      family:
        eur_range: "€12,000 - €20,000"
      relative_costs: "very_high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  duration:
    days: 16
    nights: 15

  lodging_locations:

  - id: base_1
    name: Ankerplaats
    region: Aankomst en Chugach-gebergte
    stay_nights: 2
    coordinates:
      lat: 61.2181
      lon: -149.9003

    planning_note: >-
      Herstel van een intercontinentale vlucht en kennismaking met Alaska.

    base_attractions:

    - id: flattop_mountain
      name: Platte berg
      priority: highly_recommended
      type: hike
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 61.0960
        lon: -149.6810

    - id: earthquake_park
      name: Aardbevingspark
      priority: if_time
      type: nature
      visit_duration_hours: 1
      drive_time_minutes: 10
      coordinates:
        lat: 61.1810
        lon: -149.9590

    - id: alaska_wildlife_center
      name: Alaska Wildlife Conservation Center
      priority: must_do
      type: wildlife
      visit_duration_hours: 3
      drive_time_minutes: 50
      coordinates:
        lat: 60.7940
        lon: -149.6670

  - id: base_2
    name: Seward
    region: Kenai-schiereiland
    stay_nights: 5
    coordinates:
      lat: 60.1040
      lon: -149.4420

    planning_note: >-
      Een van de sterkste natuur- en gletsjerbestemmingen in Alaska. Deze basis verdient meerdere volle dagen.

    base_attractions:

    - id: kenai_fjords_cruise
      name: Cruise door het Kenai Fjords Nationaal Park
      priority: must_do
      type: paid_activity
      visit_duration_hours: 8
      drive_time_minutes: 10
      coordinates:
        lat: 60.1190
        lon: -149.4410

    - id: exit_glacier
      name: Verlaat Gletsjer
      priority: must_do
      type: glacier
      visit_duration_hours: 3
      drive_time_minutes: 15
      coordinates:
        lat: 60.1880
        lon: -149.6310

    - id: harding_icefield
      name: Harding ijsveldroute
      priority: highly_recommended
      type: hike
      visit_duration_hours: 6
      drive_time_minutes: 15
      coordinates:
        lat: 60.1880
        lon: -149.6310

    - id: resurrection_bay
      name: De baai van de wederopstanding
      priority: must_do
      type: fjord
      visit_duration_hours: 4
      drive_time_minutes: 10
      coordinates:
        lat: 60.1170
        lon: -149.4430

    - id: sea_life_center
      name: Alaska SeaLife-centrum
      priority: highly_recommended
      type: family_activity
      visit_duration_hours: 2
      drive_time_minutes: 5
      coordinates:
        lat: 60.1020
        lon: -149.4440

    - id: whale_viewing
      name: Walvissen spotten
      priority: must_do
      type: wildlife
      visit_duration_hours: 5
      drive_time_minutes: 10
      coordinates:
        lat: 60.1190
        lon: -149.4410

  - id: base_3
    name: Talkeetna
    region: Denali-poort
    stay_nights: 3
    coordinates:
      lat: 62.3209
      lon: -150.1066

    planning_note: >-
      Schilderachtig stadje met een aantal van de beste uitzichten op Denali bij mooi weer.

    base_attractions:

    - id: denali_viewpoint
      name: Denali-standpunten
      priority: must_do
      type: mountain
      visit_duration_hours: 3
      coordinates:
        lat: 62.3210
        lon: -150.1070

    - id: talkeetna_town
      name: Talkeetna
      priority: highly_recommended
      type: town
      visit_duration_hours: 2
      coordinates:
        lat: 62.3210
        lon: -150.1090

    - id: flightseeing_denali
      name: Denali-vluchten
      priority: optional_paid_activity
      type: scenic_flight
      visit_duration_hours: 3
      coordinates:
        lat: 62.3200
        lon: -150.0940

  - id: base_4
    name: Denali Nationaal Park
    region: Alaska-bereik
    stay_nights: 4
    coordinates:
      lat: 63.7280
      lon: -148.8860

    planning_note: >-
      Belangrijkste dieren in het wild en bergbasis. Meerdere dagen zijn gerechtvaardigd omdat de zichtbaarheid van Denali weersafhankelijk is.

    base_attractions:

    - id: denali_bus
      name: Denali Park Transit-bus
      priority: must_do
      type: wildlife
      visit_duration_hours: 8
      coordinates:
        lat: 63.7280
        lon: -148.8860

    - id: savage_river
      name: Wilde rivier
      priority: highly_recommended
      type: hiking
      visit_duration_hours: 3
      coordinates:
        lat: 63.8470
        lon: -149.6210

    - id: horseshoe_lake
      name: Hoefijzer Lake Trail
      priority: highly_recommended
      type: hike
      visit_duration_hours: 2
      coordinates:
        lat: 63.7290
        lon: -148.9690

    - id: moose_bear_viewing
      name: Dieren in het wild bekijken
      priority: must_do
      type: wildlife
      visit_duration_hours: 6

    - id: eielson_center
      name: Eielson-bezoekerscentrum
      priority: highly_recommended
      type: viewpoint
      visit_duration_hours: 2
      coordinates:
        lat: 63.4580
        lon: -150.3090

  - id: base_5
    name: Palmer
    region: Matanuska-vallei
    stay_nights: 1
    coordinates:
      lat: 61.5997
      lon: -149.1146

    planning_note: >-
      Laatste overnachting voordat we terugkeren naar Anchorage.

    base_attractions:

    - id: matanuska_glacier
      name: Matanuska-gletsjer
      priority: must_do
      type: glacier
      visit_duration_hours: 4
      drive_time_minutes: 45
      coordinates:
        lat: 61.8120
        lon: -147.7340

    - id: hatcher_pass
      name: Hatcherpas
      priority: highly_recommended
      type: mountain_scenery
      visit_duration_hours: 3
      drive_time_minutes: 45
      coordinates:
        lat: 61.7770
        lon: -149.2570

  transfer_routes:

  - id: transfer_base_1_to_base_2
    from: base_1
    to: base_2
    description: Ankerplaats bij Seward
    estimated_direct_drive_hours: 2.5

    en_route_candidates:

    - attraction_ref: alaska_wildlife_center

    - id: beluga_point
      name: Beluga-punt
      priority: highly_recommended
      type: viewpoint
      coordinates:
        lat: 61.0030
        lon: -149.6570

  - id: transfer_base_2_to_base_3
    from: base_2
    to: base_3
    description: Seward naar Talkeetna
    estimated_direct_drive_hours: 4.5

  - id: transfer_base_3_to_base_4
    from: base_3
    to: base_4
    description: Talkeetna tegen Denali
    estimated_direct_drive_hours: 2.5

  - id: transfer_base_4_to_base_5
    from: base_4
    to: base_5
    description: Denali en Palmer
    estimated_direct_drive_hours: 4

  airport:
    id: anchorage_airport
    name: Internationale luchthaven Ted Stevens Anchorage
    coordinates:
      lat: 61.1744
      lon: -149.9964

  paid_activity_preferences:

    intended_paid_activities:
    - kenai_fjords_cruise
    possible_second_paid_activity:
    - bear_viewing_flight
    - flightseeing_denali
    planning_note: >-
      De Kenai Fjords-cruise wordt beschouwd als de meest waardevolle betaalde activiteit. Als het budget een extra uitspatting toelaat, kies dan voor een excursie om beren te spotten of een vliegreis rond Denali.

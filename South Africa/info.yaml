trip:
  country: South Africa

  overview:
    rank: 7

    summary: >-
      19-daagse familie-autoreis door Zuid-Afrika, met een combinatie van Kaapstad, bergen, kustlijn, wildlife, de Garden Route en safari.

    summary_reason: >-
      Zuid-Afrika is de enige bestemming op deze lijst waar je 's ochtends over de mooiste kustweg van Afrika kunt rijden, 's middags tussen pinguïns kunt wandelen, door fynbos op het Kaapse Schiereiland kunt trekken en 's avonds wijn kunt drinken in Stellenbosch. Voeg een Kruger-safari en de Drakensbergen toe, en je hebt een reis die door totaal verschillende werelden gaat — een diversiteit aan ervaringen die geen enkel ander land op deze lijst kan bieden.

    transport: "✈ Vliegtuig + 🚗 Huurauto + ✈ Binnenlandse vlucht"

    duration_days: 19
    duration_nights: 18

    travel_style: Fly-in familie-selfdrive

    highlights:
    - Tafelberg
    - Kaaps Schiereiland
    - Pinguïns bij Boulders Beach
    - Hermanus
    - Tuinroute
    - Tsitsikamma
    - Addo Olifantenpark
    - Nationaal Park Kruger
    cost:
      couple:
        eur_range: "€6,000 - €10,000"
      family:
        eur_range: "€10,000 - €17,000"
      relative_costs: "very_high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: cape_town_to_kruger

  duration:


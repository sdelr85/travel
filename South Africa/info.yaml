trip:
  country: South Africa

  overview:
    rank: 7

    summary: >
      19-day family fly-in self-drive trip through South Africa,
      combining Cape Town, mountains, coastline, wildlife,
      the Garden Route and safari.

    summary_reason: >
      A unique mix of wildlife, mountains, coastline, wine regions and safari experiences within a single trip.

    transport: "✈ Plane + 🚗 Rental car + ✈ Domestic flight"

    duration_days: 19
    duration_nights: 18

    travel_style: Fly-in family self-drive

    highlights:
      - Table Mountain
      - Cape Peninsula
      - Boulders Penguins
      - Hermanus
      - Garden Route
      - Tsitsikamma
      - Addo Elephant Park
      - Kruger National Park

    cost:
      couple:
        eur_range: "€6,000 - €10,000"
      family:
        eur_range: "€10,000 - €17,000"
      relative_costs: "high"
      assumptions:
        - "Mid-range accommodations"
        - "Peak summer season"
        - "Flights/Car rental included (if relevant)"
        - "Normal restaurant usage"
        - "Limited paid excursions (1-2 per base)"

  direction: cape_town_to_kruger

  duration:

    days: 19
    nights: 18

    base_locations: 6

    recommended_base_split:


trip:
  country: Indonesia

  overview:
    rank: 8
    summary: "18-daagse familiereis door Borneo, Java en Komodo, gericht op orang-oetans, vulkanen, tropische natuur, snorkelen en wildlife."
    summary_reason: >-
      Indonesië combineert enkele van de spectaculairste vulkanen ter wereld,
      unieke wildlife zoals orang-oetans en komodovaranen, tropische regenwouden,
      ongerepte eilanden en uitstekende snorkelmogelijkheden. Het is één van de
      weinige bestemmingen waar vulkanen, jungle en zeeleven allemaal in dezelfde
      reis kunnen worden gecombineerd.

    transport: "✈ Vliegtuig + ✈ Binnenlandse vluchten + 🚗 Chauffeur + ⛵ Boot"
    duration_days: 18
    travel_style: "Fly-in natuur- en wildlife-expeditie voor gezinnen"

    highlights:
      - Borneo orang-oetans
      - Tanjung Puting National Park
      - Mount Bromo
      - Ijen vulkaan
      - Komodo National Park
      - Komodovaranen
      - Manta rays
      - Pink Beach
      - Tropische eilandlandschappen

    cost:
      couple:
        eur_range: "€6,000 - €10,000"

      family:
        eur_range: "€10,000 - €16,000"

      relative_costs: "high"

      assumptions:
        - Middenklasse accommodaties
        - Hoogseizoen zomer
        - Binnenlandse vluchten inbegrepen
        - Bootexcursies inbegrepen
        - Normaal restaurantgebruik
        - 1 tot 2 grotere excursies

  duration:
    days: 18
    nights: 17

  lodging_locations:


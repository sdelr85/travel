trip:

  country: Namibia

  overview:
    rank: 10

    summary: >
      18-day family self-drive trip through Namibia,
      focused on desert landscapes, wildlife, mountains,
      canyons, night skies and scenic road trips.

    summary_reason: >
      A spectacular road trip through deserts, wildlife reserves, huge open landscapes and some of the clearest night skies on Earth.

    transport: "✈ Plane + 🚗 Rental car (4x4 recommended)"

    duration_days: 18
    duration_nights: 17

    travel_style: Fly-in family self-drive

    highlights:

      - Sossusvlei
      - Deadvlei
      - Sesriem Canyon
      - Swakopmund
      - Walvis Bay
      - Skeleton Coast
      - Spitzkoppe
      - Damaraland
      - Desert Elephants
      - Etosha National Park
      - Waterberg Plateau

    cost:
      couple:
        eur_range: "€6,000 - €10,000"
      family:
        eur_range: "€10,000 - €17,000"
      relative_costs: "high"
      assumptions:
        - "Mid-range accommodations"
        - "Peak summer season"
        - "Flights/Car rental included (if relevant)"
        - "Normal restaurant usage"
        - "Limited paid excursions (1-2 per base)"

  direction: clockwise

  duration:

    days: 18
    nights: 17

    base_locations: 6

    recommended_base_split:

      - base: base_1
        nights: 3

      - base: base_2
        nights: 3

      - base: base_3
        nights: 3

      - base: base_4
        nights: 2

      - base: base_5
        nights: 4

      - base: base_6
        nights: 2

  transport_constraints:

    rental_car:
      strongly_recommended: true

    vehicle:
      recommended: 4x4

    roads:
      note: >
        Large portions of Namibia are gravel roads.
        Average speeds are often much lower than expected.

  planning_principles:

    lodging_strategy:
      note: >
        Namibia is about distance and landscape.
        Minimize accommodation changes and enjoy the roadtrip.

    transfer_day:
      max_recommended_major_stops: 2

    base_day:
      max_recommended_single_drive_minutes: 120

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  airport:


trip:

  country: Namibia

  overview:
    rank: 11

    summary: >-
      18-daagse familie-autoreis door Namibië, gericht op woestijnlandschappen, wildlife, bergen, canyons, sterrenhemel en romantische ritten.

    summary_reason: >-
      Namibië is ongelijk aan elke andere bestemming op deze lijst — een oceaan van rode zandduinen bij Sossusvlei, een door de woestijn verzwolgen spookstad bij Kolmanskop, uitgestrekte zoutvlakten bij Etosha waar olifanten en leeuwen komen drinken, en een zo donkere en onduidelijke sterrenhemel dat de Melkweg met het blote oog zichtbaar is. Het is de ultieme Afrikaanse autoreis voor wie dramatische natuur en ruige wildernis wil in plaats van een conventionele safari.

    transport: "✈ Vliegtuig + 🚗 Huurauto (4x4 aanbevolen)"

    duration_days: 18
    duration_nights: 17

    travel_style: Fly-in familie-selfdrive

    highlights:

    - Sossusvlei
    - Deadvlei
    - Sesriem-kloof
    - Swakopmund
    - Walvisbaai
    - Skeletkust
    - Spitzkoppe
    - Damaraland
    - Woestijnolifanten
    - Nationaal Park Etosha
    - Waterbergplateau
    cost:
      couple:
        eur_range: "€6,000 - €10,000"
      family:
        eur_range: "€10,000 - €17,000"
      relative_costs: "very_high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: clockwise

  duration:

    days: 18
    nights: 17

    base_locations: 6

    recommended_base_split:

    - base: base_1
      nights: 3

    - base: base_2
      nights: 3

    - base: base_3
      nights: 3

    - base: base_4
      nights: 2

    - base: base_5
      nights: 4

    - base: base_6
      nights: 2

  transport_constraints:

    rental_car:
      strongly_recommended: true

    vehicle:
      recommended: 4x4

    roads:
      note: >-
        Grote delen van Namibië zijn onverharde wegen. De gemiddelde snelheden liggen vaak veel lager dan verwacht.

  planning_principles:

    lodging_strategy:
      note: >-
        Namibië gaat over afstand en landschap. Minimaliseer accommodatiewijzigingen en geniet van de roadtrip.

    transfer_day:

trip:
  country: Norway
  overview:
    rank: 4
    summary: >
      15-daagse familie-autoreis vanuit België via Hirtshals naar Noorwegen,
      met overnachting in Hirtshals, drie uitvalsbases in Geilo, Hornindal/Haugen 
      en Sykkylven/Stranda, 1 overnachting in Bergen (Fridalen) en retour via de
      ferry Bergen-Hirtshals.
    summary_reason: >-
      Een geoptimaliseerde en betaalbare familie-roadtrip gericht op ruige natuur, 
      avontuur, iconische wandelingen en gezellige Noorse dorpen. Door strategische 
      accommodatiekeuzes blijven de dagelijkse rijtijden naar topattracties zeer beperkt. 
      De internationale overtochten via Hirtshals en Bergen zorgen voor een 
      ontspannen logistieke opbouw.
    transport: "🚗 Eigen elektrische auto (EV)"
    duration_days: 15
    travel_style: "Familie roadtrip vanuit België (EV)"
    highlights:
      - Overnachting Hirtshals vooraf voor een stressvrije overtocht
      - Houten voetgangersbruggetjes, vlonderpaden en Vøringsfossen op de Hardangervidda
      - Turquoise gletsjermeren Lovatnet & Briksdalsbreen gletsjer
      - Loen Skylift & de ruige Atlantische kust bij Hoddevik / Vestkapp
      - Hjørundfjord & Norangsdalen vanuit Stranda-regio
      - Geirangerfjord autoveerboot & Trollstigen bergpas
      - Afsluiter in Bergen (Fridalen) met tram (Bybanen), Bryggen en Fløibanen
      - Fjord Line cruiseferry Bergen-Hirtshals
    cost:
      couple:
        eur_range: "€3,500 - €4,500"
      family:
        eur_range: "€4,000 - €5,000"
      relative_costs: "low_to_moderate"
      assumptions:
      - Goedgekeurde hytter/appartementen (totaal €2.500 voor 14 nachten)
      - Fjord Line overtochten & lokale autoveerboten (€1.500)
      - Laden via snelladers (Eviny, Circle K) met EV-voordelen
      - Zelf koken in hytter gemengd met lokale horeca
  direction: belgium_hirtshals_geilo_hornindal_stranda_bergen
  travel_style: family_self_drive_ev

  target_group:
    adults: 2
    children: 3

  transport_constraints:
    ev_charging:
      required: true
      coverage_note: "Uitstekende dekking met snelladers bij alle accommodaties en supermarkten (Eviny, Circle K, Recharge)."

    international_ferries_to_norway: true

    ferry_to_norway:
      route: Hirtshals-Kristiansand
      operator: Fjord Line / Color Line

    international_ferries_back_to_belgium: true

    ferry_back:
      route: Bergen-Hirtshals
      operator: Fjord Line
      departure_time: "14:00"

    route_to_norway: >
      Belgium -> Germany -> Denmark -> Hirtshals (overnight) ->
      Kristiansand -> Setesdal (Rv9) -> Geilo

    route_back_to_belgium: >
      Sykkylven/Stranda -> Bergen (Fridalen overnight) -> 
      Fjord Line Ferry -> Hirtshals -> Germany -> Belgium

    norwegian_local_car_ferries:
      allowed: true
      discount_program: "AutoPASS for ferje (50% korting op lokale oversteken)"
      routes:
        - Fodnes - Mannheller (Sognefjord)
        - Liabygda - Stranda (Storfjord)
        - Anda - Lote / Lavik - Oppedal (E39 naar Bergen)

    tourist_boats_or_fjord_cruises:
      allowed: true
      must_do_ferry: "Hellesylt - Geiranger autoveerboot door de Geirangerfjord"

  duration:
    total_nights: 14
    norway_base_nights: 12
    transit_overnights: 2

    base_locations: 3
    city_stops: 1
    transit_stops: 1

    nights_per_base:
      transit_hirtshals: 1
      base_1_geilo: 3
      base_2_hornindal_haugen: 5
      base_3_sykkylven_stranda: 4
      city_bergen: 1

    international_access_days:
      outbound_to_norway: 2
      return_to_belgium: 2

  access_plan:
    from: Belgium
    by: own_car_ev

    outbound:
      day_1:
        route:
          - Belgium
          - Germany
          - Denmark (Hirtshals)

        overnight: Hirtshals (Appartement — €98)

        planning_note: >
          Ontspannen rit richting Noord-Denemarken om filestress uit te sluiten.
          Overnachting vlak bij de haven.

      day_2:
        route:
          - Hirtshals (Ferry)
          - Kristiansand
          - Setesdal (Rv9)
          - Geilo

        ferry:
          route: Hirtshals-Kristiansand

        planning_note: >
          Ochtendferry naar Kristiansand. Panoramische rit via het schilderachtige
          Setesdal (Rv9) en Bygland omhoog naar Geilo.

    return:
      day_14:
        route:
          - Bergen (Fridalen)
          - Fjord Line Terminal Bergen

        ferry:
          route: Bergen-Hirtshals
          departure: "14:00"

        planning_note: >
          Slechts 15 minuten rijden van Fridalen naar de Fjord Line terminal.
          Inschepen rond 12:15-12:30. Overnachting aan boord.

      day_15:
        route:
          - Hirtshals (aankomst 08:00)
          - Germany
          - Belgium

        planning_note: >
          Aankomst in Hirtshals om 08:00 uur, gevolgd door de terugrit naar België.

  final_stop:
    id: bergen_fridalen
    name: Bergen (Fridalen)
    stay_nights: 1
    cost_eur: 129

    coordinates:
      lat: 60.3695
      lon: 5.3582

    planning_note: >
      Strategisch appartement in de groene woonwijk Fridalen, vlak bij de 
      tramhalte (Bybanen). Vermijdt duur stadsparkeren en drukte. 15 min van ferry.

    transport_to_center:
      type: Bybanen (Tram Linje 1)
      stop: Brann Stadion / Wergeland -> Byparken (10-12 min)
      family_discount: "Familierabatt: 1 volwassene neemt tot 4 kinderen gratis mee"

    attractions:
      - id: bryggen
        name: Bryggen Hanzewijk
        priority: must_do
        type: historic_site_walk

      - id: floibanen
        name: Fløibanen Kabelbaan & Mount Fløyen
        priority: must_do
        type: viewpoint_hike
        notes: "Bos- en trollenwandelingen op de top van Mount Fløyen bij zonsondergang."

  planning_principles:
    lodging_strategy:
      note: >
        3-5-4 nachten opbouw voor maximaal rustige dagtrips (< 45 min rijden).
        Totaal budget accommodaties: € 2.457.
        Geilo (3N - €434), Hornindal/Haugen (5N - €1.019), 
        Sykkylven/Stranda (4N - €777), Bergen (1N - €129), Hirtshals (1N - €98).

  priority_definitions:
    must_do:
      score: 4
      description: "Absoluut hoogtepunt. Vaste waarde in het wandel- en avontuurprogramma."
    highly_recommended:
      score: 3
      description: "Sterk aanbevolen wandeling of activiteit als de dagindeling het toelaat."
    if_time:
      score: 2
      description: "Goede aanvulling of alternatief bij specifiek weer."

  lodging_locations:

  - id: base_1
    name: Geilo / Hardangervidda
    region: Hardangervidda, Numedal en hoogvlakte
    stay_nights: 3
    cost_eur: 434
    coordinates:
      lat: 60.5333
      lon: 8.2000
    lodging_preference_note: "Hytte / chalet in Geilo."
    planning_note: >
      Eerste basis op de hoogvlakte. Focus op avontuurlijke wandelingen met 
      houten voetgangersbruggetjes, vlonderpaden, watervallen en wildlife.

    base_attractions:
    - id: tunga_bru_vlonderpaden
      name: Tunga Bru & Hardangervidda Vlonderpaden
      priority: must_do
      type: wooden_bridge_hike
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 60.4200
        lon: 8.0500
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_1
        notes: "Avontuurlijke wandeling over karakteristieke houten voetgangersbrggen en langgerekte houten vlonderpaden over snelstromende bergrivieren."

    - id: voringsfossen
      name: Vøringsfossen Trappenbrug & Canyon
      priority: must_do
      type: waterfall_bridge_hike
      visit_duration_hours: 2.5
      drive_time_minutes: 70
      coordinates:
        lat: 60.4266
        lon: 7.2519
      visit_strategy:
        primary_base: base_1
        notes: "Spectaculaire stalen loopbrug met 99 traptreden direct zwevend boven de diepe kloof en waterval."

    - id: prestholtrunden
      name: Prestholtrunden (Sherpa-trappen)
      priority: highly_recommended
      type: mountain_hike
      visit_duration_hours: 3.5
      drive_time_minutes: 15
      coordinates:
        lat: 60.5420
        lon: 8.1200
      difficulty: moderate
      visit_strategy:
        primary_base: base_1
        notes: "Indrukwekkende klim via stenen trappen (gebouwd door Nepalese Sherpa's) naar het Hallingskarvet plateau."

    - id: langedrag_naturpark
      name: Langedrag Naturpark
      priority: highly_recommended
      type: wildlife_adventure
      visit_duration_hours: 4
      drive_time_minutes: 35
      coordinates:
        lat: 60.4480
        lon: 8.8820
      visit_strategy:
        primary_base: base_1
        notes: "Avontuurlijk bergpark met elanden, wolven, lynxen en poolvossen. Erg leuk voor de kinderen."

  - id: base_2
    name: Hornindal / Haugen / Kalvåtn
    region: Nordfjord, gletsjers en Atlantische kust (vlakbij Hornindal Skisenter)
    stay_nights: 5
    cost_eur: 1019
    coordinates:
      lat: 61.9480
      lon: 6.5250
    lodging_preference_note: "Hytte nabij Hornindal / Haugen en de E39/Fv60."
    planning_note: >
      Budgetvriendelijke en strategische basis in het hart van de Nordfjord, vlak bij Hornindal. 
      Slechts 35-45 minuten van Lovatnet, Loen Skylift en Briksdalsbreen.

    base_attractions:
    - id: lake_lovatnet_kjenndalsbreen
      name: Lovatnet Meer & Kjenndalsbreen
      priority: must_do
      type: lake_glacier_hike
      visit_duration_hours: 5
      drive_time_minutes: 40
      coordinates:
        lat: 61.8150
        lon: 6.8900
      visit_strategy:
        primary_base: base_2
        notes: "Wandelen en kanoën langs het knalblauwe gletsjermeer richting de Kjenndalsbreen gletsjertong."

    - id: briksdalsbreen
      name: Briksdalsbreen Gletsjerwandeling
      priority: must_do
      type: glacier_hike
      visit_duration_hours: 3.5
      drive_time_minutes: 45
      coordinates:
        lat: 61.6646
        lon: 6.8749
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_2
        notes: "Mooie hike langs watervallen naar de ijsmassa van de Briksdalsbreen."

    - id: loen_skylift
      name: Loen Skylift & Mount Hoven
      priority: must_do
      type: cable_car_mountain_hike
      visit_duration_hours: 4
      drive_time_minutes: 35
      coordinates:
        lat: 61.8708
        lon: 6.8444
      visit_strategy:
        primary_base: base_2
        notes: "Steile kabelbaan omhoog naar 1.011m voor panoramische bergwandelingen op het plateau."

    - id: hoddevik_vestkapp
      name: Hoddevik Zandstrand & Vestkapp
      priority: highly_recommended
      type: coastal_cliff_hike
      visit_duration_hours: 5
      drive_time_minutes: 75
      coordinates:
        lat: 62.1260
        lon: 5.1620
      visit_strategy:
        primary_base: base_2
        notes: "Ruige Atlantische kust, wandelen over het iconische surfstrand van Hoddevik tussen steile kliffen."

  - id: base_3
    name: Sykkylven / Stranda
    region: Sunnmøre-alpen, Hjørundfjord en Geirangerfjord
    stay_nights: 4
    cost_eur: 777
    coordinates:
      lat: 62.3100
      lon: 6.7200
    lodging_preference_note: "Hytte tussen Sykkylven en Stranda."
    planning_note: >
      Ideale basis midden in de Sunnmøre-alpen voor de Geirangerfjord, Trollstigen, 
      Valldal én de nabijgelegen Hjørundfjord en Norangsdalen-vallei.

    base_attractions:
    - id: hjorundfjord_norangsdalen
      name: Hjørundfjord & Norangsdalen Vallei
      priority: must_do
      type: scenic_valley_hike
      visit_duration_hours: 4
      drive_time_minutes: 30
      coordinates:
        lat: 62.2200
        lon: 6.5800
      visit_strategy:
        primary_base: base_3
        notes: "Wandelen door een van de smalste en mooiste valleien van Noorwegen met gezonken ruïnes, direct nabij Stranda."

    - id: geirangerfjord_cruise
      name: Autoveerboot Hellesylt - Geiranger
      priority: must_do
      type: fjord_cruise_hike
      visit_duration_hours: 5
      drive_time_minutes: 40
      coordinates:
        lat: 62.0860
        lon: 6.8680
      visit_strategy:
        primary_base: base_3
        notes: "Spectaculaire vaartocht door de Geirangerfjord langs de Seven Sisters watervallen, gecombineerd met de Fossevandring watervalwandeling."

    - id: trollstigen_gudbrandsjuvet
      name: Trollstigen Bergpas & Gudbrandsjuvet
      priority: must_do
      type: mountain_pass_gorge_walk
      visit_duration_hours: 5
      drive_time_minutes: 75
      coordinates:
        lat: 62.4500
        lon: 7.6700
      visit_strategy:
        primary_base: base_3
        notes: "Wandelen over zwevende roosters boven de kolkende kloof van Gudbrandsjuvet, de aardbeien van Valldal en de 11 haarspeldbochten van Trollstigen."

    - id: strandafjellet_gondel
      name: Strandafjellet Gondel
      priority: highly_recommended
      type: panorama_mountain_walk
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 62.3080
        lon: 6.8120
      visit_strategy:
        primary_base: base_3
        notes: "Panoramische wandeling op de top met fenomenaal uitzicht over de Storfjord."

  transfer_routes:
  - id: transfer_kristiansand_to_base_1
    from: kristiansand_ferry
    to: base_1
    description: Kristiansand naar Geilo via Setesdal (Rv9)
    estimated_direct_drive_hours: 4.5
    planning_note: "Mooie binnenlandse route langs meren en bergrivieren."
    en_route_stops:
      - name: Bygland (Setesdal)
        type: scenic_coffee_stop
        duration_minutes: 45
        notes: "Gezellig houten dorpje aan het meer om even de benen te strekken."

  - id: transfer_base_1_to_base_2
    from: base_1
    to: base_2
    description: Geilo naar Hornindal/Haugen via Stegastein & Sognefjord
    estimated_direct_drive_hours: 4.75
    planning_note: "Prachtige rit met verplichte tussenstops en korte veerboot Fodnes-Mannheller."
    en_route_stops:
      - name: Vøringsfossen Waterval & Trappenbrug
        type: major_sightseeing_stop
        duration_minutes: 90
        notes: "Direct in de ochtend meepikken op de Hardangervidda voor de loopbrug en kloof."
      - name: Stegastein Uitkijkpunt
        type: major_viewpoint_stop
        duration_minutes: 45
        notes: "Uitzichtplatform hangend boven de Aurlandsfjord."
      - name: Lærdalsøyri
        type: historic_village_lunch_stop
        duration_minutes: 60
        notes: "Wandelen tussen de historische houten huisjes voor de lunch."

  - id: transfer_base_2_to_base_3
    from: base_2
    to: base_3
    description: Hornindal/Haugen naar Sykkylven/Stranda
    estimated_direct_drive_hours: 1.15
    planning_note: "Zeer korte en ontspannen verhuisrit. Volledige dag beschikbaar voor activiteiten."
    en_route_stops:
      - name: Hornindalsvatnet
        type: scenic_lake_stop
        duration_minutes: 30
        notes: "Korte stop bij het diepste meer van Europa."

  - id: transfer_base_3_to_bergen
    from: base_3
    to: bergen_fridalen
    description: Sykkylven/Stranda naar Bergen (Fridalen) via E39
    estimated_direct_drive_hours: 5.5
    planning_note: "Comfortabele rit via de E39 met twee korte fjordoversteken richting het appartement in Fridalen."
    en_route_stops:
      - name: Tvindefossen Waterval
        type: roadside_waterfall_stop
        duration_minutes: 30
        notes: "Ideale benen-strek stop langs de route met een mooie waterval."
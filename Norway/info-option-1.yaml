trip:
  country: Norway
  overview:
    rank: 4
    summary: >
      15-daagse familie-autoreis vanuit België via Hirtshals naar Noorwegen,
      met overnachting in Hirtshals, drie uitvalsbases in Geilo, Hornindal/Haugen 
      en Sykkylven/Stranda, 1 overnachting in Bergen (Fridalen) en retour via de
      ferry Bergen-Hirtshals.
    summary_reason: >-
      Een geoptimaliseerde en betaalbare familie-roadtrip gericht op ruige natuur, 
      avontuur, iconische wandelingen en gezellige Noorse dorpen. Door strategische 
      accommodatiekeuzes blijven de dagelijkse rijtijden naar topattracties uiterst beperkt 
      (vrijwel alles < 45 min). Elke basis beschikt over een rijk keuzemenu aan uitstappen.
    transport: "🚗 Eigen elektrische auto (EV)"
    duration_days: 15
    travel_style: "Familie roadtrip vanuit België (EV)"
    highlights:
      - Overnachting Hirtshals vooraf voor een stressvrije overtocht
      - Houten voetgangersbruggetjes, vlonderpaden en Vøringsfossen op de Hardangervidda
      - Aurlandsfjord, Nærøyfjord & Sognefjord op de verhuisdag naar Hornindal
      - Turquoise gletsjermeren Lovatnet & Briksdalsbreen gletsjer
      - Nordfjord verkennen, Loen Skylift & Rakssetra grasdak-hytter wandeling
      - Geirangerfjord autoveerboot (vanuit Hornindal)
      - Hjørundfjord, Norangsdalen & Sunnmøre-alpen vanuit Stranda
      - Trollstigen bergpas & Gudbrandsjuvet
      - Afsluiter in Bergen (Fridalen) met tram (Bybanen), Bryggen en Fløibanen
      - Fjord Line cruiseferry Bergen-Hirtshals
    cost:
      couple:
        eur_range: "€2,500 - €4,500"
      family:
        eur_range: "€3,000 - €4,500"
      relative_costs: "low_to_moderate"
      assumptions:
      - Goedgekeurde hytter/appartementen (totaal €2.457 voor 14 nachten)
      - Fjord Line overtochten & lokale autoveerboten (€490 - €640)
      - Laden via snelladers (Eviny, Circle K) met EV-voordelen
      - Zelf koken in hytter gemengd met lokale horeca
  direction: belgium_hirtshals_geilo_hornindal_stranda_bergen
  travel_style: family_self_drive_ev

  target_group:
    adults: 2
    children: 3

  transport_constraints:
    ev_charging:
      required: true
      coverage_note: "Uitstekende dekking met snelladers bij alle accommodaties en supermarkten (Eviny, Circle K, Recharge)."

    international_ferries_to_norway: true

    ferry_to_norway:
      route: Hirtshals-Kristiansand
      operator: Fjord Line / Color Line

    international_ferries_back_to_belgium: true

    ferry_back:
      route: Bergen-Hirtshals
      operator: Fjord Line
      departure_time: "14:00"

    route_to_norway: >
      Belgium -> Germany -> Denmark -> Hirtshals (overnight) ->
      Kristiansand -> Setesdal (Rv9) -> Geilo

    route_back_to_belgium: >
      Sykkylven/Stranda -> Bergen (Fridalen overnight) -> 
      Fjord Line Ferry -> Hirtshals -> Germany -> Belgium

    norwegian_local_car_ferries:
      allowed: true
      discount_program: "AutoPASS for ferje (50% korting op lokale oversteken)"
      routes:
        - Fodnes - Mannheller (Sognefjord)
        - Liabygda - Stranda (Storfjord)
        - Anda - Lote / Lavik - Oppedal (E39 naar Bergen)

    tourist_boats_or_fjord_cruises:
      allowed: true
      must_do_ferry: "Hellesylt - Geiranger autoveerboot door de Geirangerfjord"

  duration:
    total_nights: 14
    norway_base_nights: 12
    transit_overnights: 2

    base_locations: 3
    city_stops: 1
    transit_stops: 1

    nights_per_base:
      transit_hirtshals: 1
      base_1_geilo: 3
      base_2_hornindal_haugen: 5
      base_3_sykkylven_stranda: 4
      city_bergen: 1

    international_access_days:
      outbound_to_norway: 2
      return_to_belgium: 2

  access_plan:
    from: Belgium
    by: own_car_ev

    outbound:
      day_1:
        route:
          - Belgium
          - Germany
          - Denmark (Hirtshals)

        overnight: Hirtshals (Appartement — €98)

        planning_note: >
          Ontspannen rit richting Noord-Denemarken om filestress uit te sluiten.
          Overnachting vlak bij de haven.

      day_2:
        route:
          - Hirtshals (Ferry)
          - Kristiansand
          - Setesdal (Rv9)
          - Geilo

        ferry:
          route: Hirtshals-Kristiansand

        planning_note: >
          Ochtendferry naar Kristiansand. Panoramische rit via het schilderachtige
          Setesdal (Rv9) en Bygland omhoog naar Geilo.

    return:
      day_14:
        route:
          - Bergen (Fridalen)
          - Fjord Line Terminal Bergen

        ferry:
          route: Bergen-Hirtshals
          departure: "14:00"

        planning_note: >
          Slechts 15 minuten rijden van Fridalen naar de Fjord Line terminal.
          Inschepen rond 12:15-12:30. Overnachting aan boord.

      day_15:
        route:
          - Hirtshals (aankomst 08:00)
          - Germany
          - Belgium

        planning_note: >
          Aankomst in Hirtshals om 08:00 uur, gevolgd door de terugrit naar België.

  final_stop:
    id: bergen_fridalen
    name: Bergen (Fridalen)
    stay_nights: 1
    cost_eur: 129

    coordinates:
      lat: 60.3695
      lon: 5.3582
    accommodation_url: "https://www.booking.com/hotel/no/central-4-room-apartment.html?aid=304142&label=mkt123sc-7e7e6517-c8ab-4727-94dc-f8edfe60f181&sid=dc8c3bbaa57eab8bbe48d6bf11d235c5&all_sr_blocks=1579669301_429064520_6_0_0&checkin=2027-08-06&checkout=2027-08-07&dest_id=-252873&dest_type=city&dist=0&group_adults=5&group_children=0&hapos=1&highlighted_blocks=1579669301_429064520_6_0_0&hpos=1&matching_block_id=1579669301_429064520_6_0_0&no_rooms=1&req_adults=5&req_children=0&room1=A%2CA%2CA%2CA%2CA&sb_price_type=total&sr_order=popularity&sr_pri_blocks=1579669301_429064520_6_0_0__135000&srepoch=1792922328&srpvid=b11146288984009d&type=total&ucfs=1&)"
    accommodation_label: "Booking.com: Central 4 room, Bergen"

    planning_note: >
      Strategisch appartement in de groene woonwijk Fridalen, vlak bij de 
      tramhalte (Bybanen). Vermijdt duur stadsparkeren en drukte. 15 min van ferry.

    transport_to_center:
      type: Bybanen (Tram Linje 1)
      stop: Brann Stadion / Wergeland -> Byparken (10-12 min)
      family_discount: "Familierabatt: 1 volwassene neemt tot 4 kinderen gratis mee"

    attractions:
      - id: bryggen
        name: Bryggen Hanzewijk
        priority: must_do
        type: historic_site_walk

      - id: floibanen
        name: Fløibanen Kabelbaan & Mount Fløyen
        priority: must_do
        type: viewpoint_hike
        notes: "Bos- en trollenwandelingen op de top van Mount Fløyen bij zonsondergang."

  route_planner_order:
    - hirtshals_ferry
    - base_1
    - base_2
    - base_3
    - bergen_fridalen

  route_planner_locations:
    - id: hirtshals_ferry
      name: Hirtshals
      coordinates:
        lat: 57.5884
        lon: 9.9700
      accommodation_url: "https://www.airbnb.be/rooms/18759880?adults=4&children=1&infants=0&pets=0&wishlist_item_id=11006997950286&source_impression_id=p3_1792922228_P3TnUlGMLzVAtF0q&previous_page_section_name=1000"
      accommodation_label: "Airbnb: Højgaards bijgebouw"

  planning_principles:
    lodging_strategy:
      note: >
        3-5-4 nachten opbouw voor maximaal rustige dagtrips (< 45 min rijden).
        Totaal budget accommodaties: € 2.457.
        Geilo (3N - €434), Hornindal/Haugen (5N - €1.019), 
        Sykkylven/Stranda (4N - €777), Bergen (1N - €129), Hirtshals (1N - €98).

  priority_definitions:
    must_do:
      score: 4
      description: "Absoluut hoogtepunt. Vaste waarde in het wandel- en avontuurprogramma."
    highly_recommended:
      score: 3
      description: "Sterk aanbevolen wandeling of activiteit als de dagindeling het toelaat."
    if_time:
      score: 2
      description: "Goede aanvulling of alternatief bij specifiek weer."

  lodging_locations:

  - id: base_1
    name: Geilo / Hardangervidda
    region: Hardangervidda, Numedal en hoogvlakte
    stay_nights: 3
    cost_eur: 434
    coordinates:
      lat: 60.5333
      lon: 8.2000
    accommodation_url: "https://www.airbnb.be/rooms/1575326504878023726?adults=4&children=1&infants=0&pets=0&wishlist_item_id=11006994583275&check_in=2027-07-25&check_out=2027-07-28&source_impression_id=p3_1792922228_P3o6WqpYbwy_wWkw&previous_page_section_name=1000"
    accommodation_label: "Airbnb: Soltun Geilo"
    lodging_preference_note: "Hytte / chalet in Geilo."
    planning_note: >
      Eerste basis op de hoogvlakte. Focus op avontuurlijke wandelingen met 
      houten voetgangersbruggetjes, vlonderpaden, watervallen en wildlife.

    base_attractions:
    - id: tunga_bru_vlonderpaden
      name: Tunga Bru & Hardangervidda Vlonderpaden
      priority: must_do
      type: wooden_bridge_hike
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 60.4200
        lon: 8.0500
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_1
        notes: "Avontuurlijke wandeling over karakteristieke houten voetgangersbrggen en langgerekte houten vlonderpaden over snelstromende bergrivieren."

    - id: voringsfossen
      name: Vøringsfossen Trappenbrug & Canyon
      priority: must_do
      type: waterfall_bridge_hike
      visit_duration_hours: 2.5
      drive_time_minutes: 70
      coordinates:
        lat: 60.4266
        lon: 7.2519
      visit_strategy:
        primary_base: base_1
        notes: "Spectaculaire stalen loopbrug met 99 traptreden direct zwevend boven de diepe kloof en waterval."

    - id: prestholtrunden
      name: Prestholtrunden (Sherpa-trappen)
      priority: highly_recommended
      type: mountain_hike
      visit_duration_hours: 3.5
      drive_time_minutes: 15
      coordinates:
        lat: 60.5420
        lon: 8.1200
      difficulty: moderate
      visit_strategy:
        primary_base: base_1
        notes: "Indrukwekkende klim via stenen trappen (gebouwd door Nepalese Sherpa's) naar het Hallingskarvet plateau."

    - id: langedrag_naturpark
      name: Langedrag Naturpark
      priority: highly_recommended
      type: wildlife_adventure
      visit_duration_hours: 4
      drive_time_minutes: 35
      coordinates:
        lat: 60.4480
        lon: 8.8820
      visit_strategy:
        primary_base: base_1
        notes: "Avontuurlijk bergpark met elanden, wolven, lynxen en poolvossen. Erg leuk voor de kinderen."

    - id: ustedalsfjorden_hike
      name: Ustedalsfjorden Meerwandeling
      priority: if_time
      type: lake_hike
      visit_duration_hours: 3
      drive_time_minutes: 5
      coordinates:
        lat: 60.5300
        lon: 8.2100
      difficulty: easy
      visit_strategy:
        primary_base: base_1
        notes: "Ontspannen en vlakke gezinswandeling rond het meer van Geilo over houten vlonders en paadjes."

    - id: geilo_hoyt_lav
      name: Geilo Høyt & Lav Klimpark / Ziplines
      priority: if_time
      type: adventure_park
      visit_duration_hours: 3
      drive_time_minutes: 5
      coordinates:
        lat: 60.5350
        lon: 8.2050
      visit_strategy:
        primary_base: base_1
        notes: "Boomtop klimpark met spannende tokkelbanen en downhill fietsopties voor het gezin."

  - id: base_2
    name: Hornindal / Haugen / Kalvåtn
    region: Nordfjord, gletsjers en Geirangerfjord (vlakbij Hornindal Skisenter)
    stay_nights: 5
    cost_eur: 1019
    coordinates:
      lat: 61.9480
      lon: 6.5250
    accommodation_url: "https://www.airbnb.be/rooms/933445901700871988?adults=4&children=1&infants=0&pets=0&wishlist_item_id=11006983865889&check_in=2027-07-28&check_out=2027-08-02&source_impression_id=p3_1792922228_P3BIEr_QDbjiwNCe&previous_page_section_name=1000"
    accommodation_label: "Airbnb: Nieuw huisje, fantastische locatie"
    lodging_preference_note: "Hytte nabij Hornindal / Haugen en de E39/Fv60."
    planning_note: >
      Budgetvriendelijke en strategische basis in het hart van de Nordfjord, vlak bij Hornindal. 
      Slechts 35-45 minuten van Lovatnet, Loen Skylift, Briksdalsbreen én Hellesylt (Geiranger-boot).

    base_attractions:
    - id: geirangerfjord_cruise_from_base2
      name: Geirangerfjord Autoveerboot (via Hellesylt)
      priority: must_do
      type: fjord_cruise_viewpoint
      visit_duration_hours: 5
      drive_time_minutes: 40
      coordinates:
        lat: 62.0860
        lon: 6.8680
      visit_strategy:
        primary_base: base_2
        notes: "Rijd naar Hellesylt voor de beroemde veerboot door de Geirangerfjord langs de Seven Sisters watervallen en Flydalsjuvet."

    - id: lake_lovatnet_kjenndalsbreen
      name: Lovatnet Meer & Kjenndalsbreen
      priority: must_do
      type: lake_glacier_hike
      visit_duration_hours: 5
      drive_time_minutes: 40
      coordinates:
        lat: 61.8150
        lon: 6.8900
      visit_strategy:
        primary_base: base_2
        notes: "Wandelen en kanoën langs het knalblauwe gletsjermeer richting de Kjenndalsbreen gletsjertong."

    - id: briksdalsbreen
      name: Briksdalsbreen Gletsjerwandeling
      priority: must_do
      type: glacier_hike
      visit_duration_hours: 3.5
      drive_time_minutes: 45
      coordinates:
        lat: 61.6646
        lon: 6.8749
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_2
        notes: "Mooie hike langs watervallen naar de ijsmassa van de Briksdalsbreen."

    - id: loen_skylift
      name: Loen Skylift & Mount Hoven
      priority: must_do
      type: cable_car_mountain_hike
      visit_duration_hours: 4
      drive_time_minutes: 35
      coordinates:
        lat: 61.8708
        lon: 6.8444
      visit_strategy:
        primary_base: base_2
        notes: "Steile kabelbaan omhoog naar 1.011m voor panoramische bergwandelingen op het plateau."

    - id: nordfjord_kust_en_panorama
      name: Nordfjord Panoramaroute & Fjordverkenning
      priority: highly_recommended
      type: scenic_fjord_exploration
      visit_duration_hours: 4
      drive_time_minutes: 20
      coordinates:
        lat: 61.9167
        lon: 6.0833
      difficulty: easy
      visit_strategy:
        primary_base: base_2
        notes: "Schilderachtige rit of wandeling langs de oevers van de Nordfjord, inclusief gezellige stop in Stryn of Utvik."

    - id: rakssetra_hike
      name: Rakssetra Grasdak-Hytter Wandeling
      priority: highly_recommended
      type: panoramic_hike
      visit_duration_hours: 2.5
      drive_time_minutes: 35
      coordinates:
        lat: 61.8800
        lon: 6.8200
      difficulty: moderate
      visit_strategy:
        primary_base: base_2
        notes: "Prachtige korte klim (45 min) naar een idyllische alm met houten grasdakhutten en uitzicht over de fjord."

    - id: gamle_strynefjellsvegen
      name: Gamle Strynefjellsvegen Bergweg
      priority: if_time
      type: scenic_mountain_drive
      visit_duration_hours: 3.5
      drive_time_minutes: 40
      coordinates:
        lat: 61.9800
        lon: 7.4000
      visit_strategy:
        primary_base: base_2
        notes: "Historische, ruige bergweg met sneeuwmuren, steenmannetjes en watervallen."

  - id: base_3
    name: Sykkylven / Stranda
    region: Sunnmøre-alpen, Hjørundfjord en Trollstigen
    stay_nights: 4
    cost_eur: 777
    coordinates:
      lat: 62.3100
      lon: 6.7200
    accommodation_url: "https://www.airbnb.be/rooms/1690369542702713045?adults=4&children=1&infants=0&pets=0&wishlist_item_id=11006997429322&check_in=2027-08-02&check_out=2027-08-06&source_impression_id=p3_1792922228_P3BxNO7vH9tpjZwy&previous_page_section_name=1000"
    accommodation_label: "Airbnb: Welkom bij Solglytt!"
    lodging_preference_note: "Hytte tussen Sykkylven en Stranda."
    planning_note: >
      Ideale basis midden in de Sunnmøre-alpen voor Trollstigen, Valldal, 
      de nabijgelegen Hjørundfjord, Norangsdalen-vallei én spectaculaire bergwandelingen.

    base_attractions:
    - id: hjorundfjord_norangsdalen
      name: Hjørundfjord & Norangsdalen Vallei
      priority: must_do
      type: scenic_valley_hike
      visit_duration_hours: 4
      drive_time_minutes: 30
      coordinates:
        lat: 62.2200
        lon: 6.5800
      visit_strategy:
        primary_base: base_3
        notes: "Wandelen door een van de smalste en mooiste valleien van Noorwegen met gezonken ruïnes, direct nabij Stranda."

    - id: trollstigen_gudbrandsjuvet
      name: Trollstigen Bergpas & Gudbrandsjuvet
      priority: must_do
      type: mountain_pass_gorge_walk
      visit_duration_hours: 5
      drive_time_minutes: 75
      coordinates:
        lat: 62.4500
        lon: 7.6700
      visit_strategy:
        primary_base: base_3
        notes: "Wandelen over zwevende roosters boven de kolkende kloof van Gudbrandsjuvet, de aardbeien van Valldal en de 11 haarspeldbochten van Trollstigen."

    - id: strandafjellet_gondel
      name: Strandafjellet Gondel & Panoramapad
      priority: highly_recommended
      type: panorama_mountain_walk
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 62.3080
        lon: 6.8120
      visit_strategy:
        primary_base: base_3
        notes: "Panoramische wandeling op de top met fenomenaal uitzicht over de Storfjord."

    - id: saksa_urke_hike
      name: Saksa / Urke Bergwandeling (Sunnmøre-alpen)
      priority: highly_recommended
      type: mountain_hike
      visit_duration_hours: 4.5
      drive_time_minutes: 35
      coordinates:
        lat: 62.2150
        lon: 6.5600
      difficulty: moderate_to_demanding
      visit_strategy:
        primary_base: base_3
        notes: "Avontuurlijke klim vanuit Urke met fenomenaal uitzicht over de spitse bergtoppen en de diepe Hjørundfjord."

    - id: valldal_rafting_canyoning
      name: Valldal Gezins-Rafting of River Walk
      priority: if_time
      type: river_adventure
      visit_duration_hours: 3.5
      drive_time_minutes: 40
      coordinates:
        lat: 62.3000
        lon: 7.2600
      visit_strategy:
        primary_base: base_3
        notes: "Spannende maar veilige rivier- en raftingactiviteiten voor het gezin op de Valldøla-rivier."

  transfer_routes:
  - id: transfer_kristiansand_to_base_1
    from: kristiansand_ferry
    to: base_1
    description: Kristiansand naar Geilo via Setesdal (Rv9)
    estimated_direct_drive_hours: 4.5
    planning_note: "Mooie binnenlandse route langs meren en bergrivieren."
    en_route_stops:
      - name: Bygland (Setesdal)
        priority: highly_recommended
        type: scenic_coffee_stop
        duration_minutes: 45
        notes: "Gezellig houten dorpje aan het meer om even de benen te strekken."
        coordinates:
          lat: 58.8280
          lon: 7.7960

  - id: transfer_base_1_to_base_2
    from: base_1
    to: base_2
    description: Geilo naar Hornindal/Haugen via Aurlandsfjord, Nærøyfjord & Sognefjord
    estimated_direct_drive_hours: 5.25
    planning_note: >
      Een van de meest spectaculaire autoroutes van Noorwegen. Je rijdt via de Hardangervidda,
      de Aurlandsfjord, langs de Nærøyfjord-regio en steekt de Sognefjord over per autoveerboot.
    en_route_stops:
      - name: Vøringsfossen Waterval & Trappenbrug
        priority: must_do
        type: major_sightseeing_stop
        duration_minutes: 90
        notes: "Direct in de ochtend meepikken op de Hardangervidda voor de spectaculaire loopbrug en canyon."
        coordinates:
          lat: 60.4266
          lon: 7.2519
      - name: Stegastein Uitkijkpunt (Aurlandsfjord)
        priority: must_do
        type: major_viewpoint_stop
        duration_minutes: 45
        notes: "Zwevend houten uitzichtplatform met adembenemend panorama over de Aurlandsfjord."
        coordinates:
          lat: 60.9085
          lon: 7.2137
      - name: Flåm & Nærøyfjord Panorama (Gudvangen)
        priority: highly_recommended
        type: scenic_fjord_stop
        duration_minutes: 60
        notes: "Korte stop in het fjordenvallei-hart bij Flåm of Gudvangen (Nærøyfjord, UNESCO Werelderfgoed)."
        coordinates:
          lat: 60.8630
          lon: 7.1130
      - name: Lærdalsøyri Historisch Dorp
        priority: if_time
        type: historic_village_lunch_stop
        duration_minutes: 45
        notes: "Sfeervolle lunchstop tussen de beschermde 18e-eeuwse houten huisjes."
        coordinates:
          lat: 61.0990
          lon: 7.4820
      - name: Sognefjord Fjordoversteek (Fodnes - Mannheller)
        priority: must_do
        type: car_ferry_crossing
        duration_minutes: 20
        notes: "Korte en ontspannen autoveerboot-oversteek over de langste fjord van Noorwegen."
        coordinates:
          lat: 61.1480
          lon: 7.3820

  - id: transfer_base_2_to_base_3
    from: base_2
    to: base_3
    description: Hornindal/Haugen naar Sykkylven/Stranda
    estimated_direct_drive_hours: 1.15
    planning_note: "Zeer korte en ontspannen verhuisrit. Volledige dag beschikbaar voor activiteiten."
    en_route_stops:
      - name: Hornindalsvatnet
        priority: highly_recommended
        type: scenic_lake_stop
        duration_minutes: 30
        notes: "Korte stop bij het diepste meer van Europa (514m diep)."
        coordinates:
          lat: 61.9730
          lon: 6.5090

  - id: transfer_base_3_to_bergen

trip:
  country: Norway
  overview:
    rank: 4
    summary: >
      13-daagse familie-autoreis vanuit België via Hirtshals naar Noorwegen,
      met drie bases in Hardangervidda, Sognefjord en Nordfjord en retour via de
      ferry Bergen-Hirtshals.
    summary_reason: >-
      Het fjordenland van Noorwegen is een van de meest spectaculaire plekken van Europa, en het feit dat het vanuit België per auto bereikbaar is, maakt het extra aantrekkelijk. Nærøyfjord, Geirangerfjord en de Loen Skylift bieden bij elke bocht wereldklasse scenerie. De ferryverbindingen via Hirtshals maken de reis comfortabeler en beperken het aantal lange transitdagen, terwijl het hele gezin vanaf vertrek volledig ondergedompeld wordt in Scandinavische landschappen.
    transport: "🚗Eigen auto"
    duration_days: 14
    travel_style: "Familie roadtrip vanuit België"
    highlights:
      - Ferry Hirtshals-Kristiansand (Fjord FSTR of MS Stavangerfjord)
      - Hardangervidda en Numedal
      - Sognefjord, Nærøyfjord en Aurlandsfjord
      - Nordfjord, Loen Skylift en Geirangerfjord
      - Bergen als afsluiter van de reis
      - Ferry Bergen-Hirtshals
    cost:
      couple:
        eur_range: "€3,000 - €6,000"
      family:
        eur_range: "€5,000 - €8,000"
      relative_costs: "low"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: belgium_hirtshals_hardangervidda_aurland_loen_bergen
  travel_style: family_self_drive

  target_group:
    adults: 2
    children: 3

  transport_constraints:
    international_ferries_to_norway: true

    ferry_to_norway:
      route: Hirtshals-Kristiansand

    international_ferries_back_to_belgium: true

    ferry_back:
      route: Bergen-Hirtshals

    route_to_norway: >
      Belgium -> Germany -> Denmark -> Hirtshals ->
      Kristiansand -> Hardangervidda (Geilo/Uvdal)

    route_back_to_belgium: >
      Loen -> Bergen -> Hirtshals -> Germany -> Belgium

    norwegian_local_car_ferries:
      allowed: true

    tourist_boats_or_fjord_cruises:
      allowed: optional

  duration:
    norway_base_nights: 12
    norway_base_days: 13

    base_locations: 3

    nights_per_base:
      base_1: 3
      base_2: 5
      base_3: 4

    international_access_days:
      outbound_to_norway: 1
      return_to_belgium: 1

      note: >
        Overnachting in Hirtshals voor vertrek.
        Aankomst in Noorwegen dezelfde dag als de ferry.
        Na de ferry Bergen-Hirtshals volgt nog één lange rijdag
        terug naar België.
  
  access_plan:
    from: Belgium
    by: own_car

    outbound:
      day_1:
        route:
          - Belgium
          - Germany
          - Hirtshals

        overnight: Hirtshals

        planning_note: >
          Lange verplaatsingsdag. Overnacht dicht bij de ferryterminal
          zodat de ferry de volgende ochtend zonder stress gehaald wordt.

      day_2:
        route:
          - Hirtshals
          - Kristiansand
          - Telemarksvegen
          - Numedal
          - Geilo/Uvdal

        ferry:
          route: Hirtshals-Kristiansand

        planning_note: >
          Na aankomst in Kristiansand via Dalen en het schilderachtige Numedal
          omhoog rijden naar de eerste basis (Hardangervidda-oost). Rustig rijstempo
          in verband met wagenziekte.

    return:
      day_13:
        route:
          - Hirtshals
          - Germany
          - Belgium

        planning_note: >
          Vroege aankomst in Hirtshals na de nachtferry vanuit Bergen.
          Vervolgens volledige rit naar België.

  final_stop:
    id: bergen_ferry
    name: Bergen

    coordinates:
      lat: 60.3913
      lon: 5.3221

    planning_note: >
      Laatste stop van de rondreis voor inscheping op de ferry naar
      Hirtshals.

    attractions:
      - id: bryggen
        name: Bryggen
        priority: must_do

      - id: floyen
        name: Fløyen
        priority: must_do

      - id: fish_market
        name: Fish Market
        priority: highly_recommended
  
  planning_principles:
    lodging_strategy:
      note: >
        Gebruik van de 3-5-4 nachten verdeling.
        De eerste basis ligt direct aan de oostkant van de Hardangervidda (Geilo/Uvdal),
        zodat de route korter is en de focus direct op wandelen en natuur ligt.

  priority_definitions:
    must_do:
      score: 4
      description: "Absoluut hoogtepunt. Probeer dit op te nemen, tenzij het weer of de timing dit onrealistisch maken."
    highly_recommended:
      score: 3
      description: "Sterk aanbevolen als het weer goed is en het dagschema het toelaat."
    if_time:
      score: 2
      description: "Goede aanvulling, maar niet essentieel."
    optional_paid_activity:
      score: 1
      description: "Het overwegen waard, maar niet essentieel en moet bewust worden gekozen."

  lodging_locations:

  - id: base_1
    name: Geilo / Uvdal / Hardangervidda-Oost
    region: Hardangervidda, Numedal en hoogvlakte
    stay_nights: 3
    coordinates:
      lat: 60.5333
      lon: 8.2000
    lodging_preference_note: "Fjellstove, houten chalet (hytte) of appartement in de omgeving van Geilo of Uvdal."
    planning_note: >
      Eerste basis direct aan de rand van de Hardangervidda. Ideaal om na de reisdag
      uit te rusten en te starten met wandelingen op de hoogvlakte en cultuurbezoek in het Numedal.
    base_attractions:
    - id: hardangervidda_national_park
      name: Hardangervidda Nationaal Park (Oostkant)
      priority: must_do
      type: plateau_scenic_drive_hike
      visit_duration_hours: 4
      drive_time_minutes: 30
      coordinates:
        lat: 60.3500
        lon: 7.8000
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_1
        notes: "Uitgestrekte wandelmogelijkheden op de hoogvlakte. Ideaal voor gezinsvriendelijke wandelingen in open landschap."

    - id: uvdal_stave_church
      name: Staafkerk van Uvdal
      priority: highly_recommended
      type: cultural_site
      visit_duration_hours: 1.5
      drive_time_minutes: 20
      coordinates:
        lat: 60.2600
        lon: 8.8300
      visit_strategy:
        primary_base: base_1
        secondary_opportunity:
        - transfer_kristiansand_to_base_1
        notes: "Historische staafkerk in het Numedal, perfecte en rustige stop."

    - id: voringsfossen
      name: Vøringsfossen & Hardangervidda-canyon
      priority: must_do
      type: waterfall_viewpoint
      visit_duration_hours: 2
      drive_time_minutes: 45
      coordinates:
        lat: 60.4266
        lon: 7.2519
      visit_strategy:
        primary_base: base_1
        notes: "Indrukwekkende waterval met spectaculaire wandelpaden en hangbruggen aan de rand van de hoogvlakte."

    - id: geilo_activities
      name: Geilo bergdorp en activiteiten
      priority: highly_recommended
      type: town_outdoor_activities
      visit_duration_hours: 3
      drive_time_minutes: 15
      coordinates:
        lat: 60.5333
        lon: 8.2000
      visit_strategy:
        primary_base: base_1
        notes: "Gezellig bergdorp met faciliteiten, supermarkten en opties voor e-biken of lichte avontuurlijke activiteiten."

    arrival_day_candidates:
      route_from: kristiansand
      note: "Rustige binnenlandse route via Dalen en het Numedal met een stop bij Uvdal."
      candidates:
      - external_stop_ref: dalen
      - attraction_ref: uvdal_stave_church

    departure_day_candidates:
      route_to: base_2
      note: "Route dwars over de Hardangervidda richting de fjorden (langs Vøringsfossen en Eidfjord)."
      candidates:
      - attraction_ref: voringsfossen
      - external_stop_ref: eidfjord
      - external_stop_ref: hardanger_bridge

  - id: base_2
    name: Aurland / Flåm / Voss
    region: Sognefjord, Naeroyfjord en Aurlandsfjord
    stay_nights: 5
    coordinates:
      lat: 60.9080
      lon: 7.1870
    lodging_preference_note: "Aurland is sfeervol en rustig. Voss is centraal voor uitvalswegen. Flåm is toeristisch maar heel praktisch."
    planning_note: "Uitgebreide basis van 5 nachten in het hart van de fjorden. Biedt maximale flexibiliteit voor slechte weersomstandigheden en diverse avonturen."

    base_attractions:
    - id: stegastein_viewpoint
      name: Stegastein-uitkijkpunt
      priority: must_do
      type: viewpoint
      visit_duration_hours: 1
      drive_time_minutes: 20
      coordinates:
        lat: 60.9085
        lon: 7.2137
      visit_strategy:
        primary_base: base_2
        good_for_evening_visit: true
        notes: "Iconisch uitkijkplatform hangend boven de Aurlandsfjord."

    - id: naeroyfjord
      name: Nærøyfjord RIB-safari / Cruise
      priority: must_do
      type: fjord
      visit_duration_hours: 3
      drive_time_minutes: 25
      coordinates:
        lat: 60.9455
        lon: 6.9504
      visit_strategy:
        primary_base: base_2
        notes: "Spectaculaire vaartocht door de smalste en steilste arm van de Sognefjord."

    - id: flam_zipline
      name: Flåm Zipline
      priority: optional_paid_activity
      type: adventure_activity
      visit_duration_hours: 2
      drive_time_minutes: 15
      coordinates:
        lat: 60.8610
        lon: 7.1139
      visit_strategy:
        primary_base: base_2
        notes: "De langste zipline van Scandinavië voor wat extra familiegoed avontuur."

    - id: undredal
      name: Undredal
      priority: highly_recommended
      type: fjord_village
      visit_duration_hours: 1.5
      drive_time_minutes: 20
      coordinates:
        lat: 60.9516
        lon: 7.1020
      visit_strategy:
        primary_base: base_2
        notes: "Idyllisch geitendorpje aan de fjord met het kleinste staafkerkje."

    - id: aurlandsdalen
      name: Wandeling in de Aurlandsdalenvallei
      priority: if_time
      type: hike
      visit_duration_hours: 5
      drive_time_minutes: 40
      coordinates:
        lat: 60.8200
        lon: 7.5500
      difficulty: moderate
      visit_strategy:
        primary_base: base_2
        notes: "Prachtige kloofwandeling (Grand Canyon van Noorwegen)."

    arrival_day_candidates:
      route_from: base_1
      note: "Oversteek via de Hardangervidda met stop bij Vøringsfossen."
      candidates:
      - attraction_ref: voringsfossen
      - external_stop_ref: eidfjord

    departure_day_candidates:
      route_to: base_3
      note: "Route naar Nordfjord via Fjærland en gletsjeruitkijkpunten."
      candidates:
      - external_stop_ref: boyabreen_glacier
      - external_stop_ref: fjaerland

  - id: base_3
    name: Loen / Olden / Stryn
    region: Nordfjord, gletsjers en Loen Skylift
    stay_nights: 4
    coordinates:
      lat: 61.8716
      lon: 6.8450
    lodging_preference_note: "Houten chalets (hytter) aan het water bij Lovatnet of Oldevatnet, of hotels nabij Loen/Stryn."
    planning_note: "Prachtige regio met felblauwe meren, indrukwekkende gletsjers en spectaculaire uitzichten."

    base_attractions:
    - id: loen_skylift
      name: Loen Skylift / Mount Hoven
      priority: must_do
      type: viewpoint_paid_activity
      visit_duration_hours: 3
      drive_time_minutes: 10
      coordinates:
        lat: 61.8708
        lon: 6.8444
      visit_strategy:
        primary_base: base_3
        notes: "Snelle kabelbaan naar de top van de Hoven met panoramisch uitzicht over de fjorden."

    - id: lake_lovatnet
      name: Het Lovatnet-meer (Kano/SUP)
      priority: must_do
      type: lake_scenic_drive_walk
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 61.8150
        lon: 6.8900
      visit_strategy:
        primary_base: base_3
        notes: "Turquoise gletsjermeer waar je heerlijk kunt varen of ontspannen aan de oever."

    - id: briksdalsbreen
      name: Briksdalsbreen-gletsjer
      priority: highly_recommended
      type: glacier_walk
      visit_duration_hours: 3
      drive_time_minutes: 45
      coordinates:
        lat: 61.6646
        lon: 6.8749
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_3
        notes: "Toegankelijke en schitterende wandeling naar de tong van de gletsjer."

    - id: geirangerfjord
      name: Geirangerfjord & Dalsnibba
      priority: must_do
      type: fjord_viewpoint
      visit_duration_hours: 5
      drive_time_minutes: 120
      coordinates:
        lat: 62.1049
        lon: 7.2050
      visit_strategy:
        primary_base: base_3
        notes: "Dagtocht over de weg naar het wereldberoemde Geiranger en het uitzichtpunt op de Dalsnibba."

    arrival_day_candidates:
      route_from: base_2
      note: "Schilderachtige route via Fjærland."
      candidates:
      - external_stop_ref: fjaerland
      - external_stop_ref: boyabreen_glacier

    departure_day_candidates:
      route_to: bergen_ferry
      note: "Comfortabele transferdag naar Bergen met waterval- en cultuurstops."
      candidates:
      - external_stop_ref: vik
      - external_stop_ref: hopperstad_stave_church
      - external_stop_ref: tvindefossen

  transfer_routes:
  - id: transfer_kristiansand_to_base_1
    from: kristiansand_ferry
    to: base_1
    description: Kristiansand naar Hardangervidda-Oost (Geilo/Uvdal)
    estimated_direct_drive_hours: 4.0
    planning_note: "Rustige route via Dalen en het Numedal. Hou rekening met een rustig tempo om wagenziekte te voorkomen."
    max_recommended_major_stops: 2
    en_route_candidates:
    - id: dalen
      name: Dalen & Telemarkkanaal
      priority: if_time
      type: scenic_stop
      stop_duration_hours: 1
      coordinates:
        lat: 59.4470
        lon: 8.0000
      transfer_role: candidate

    - attraction_ref: uvdal_stave_church
      priority: highly_recommended
      stop_duration_hours: 1.0
      transfer_role: candidate

  - id: transfer_base_1_to_base_2
    from: base_1
    to: base_2
    description: Geilo/Uvdal naar Aurland/Flåm via Hardangervidda
    estimated_direct_drive_hours: 3.0
    planning_note: "Korte en prachtige rit dwars over de hoogvlakte met onderweg de Vøringsfossen."
    max_recommended_major_stops: 2
    en_route_candidates:
    - attraction_ref: voringsfossen
      priority: must_do
      stop_duration_hours: 1.5
      transfer_role: candidate

    - id: eidfjord
      name: Eidfjord
      priority: if_time
      type: fjord_village_lunch_stop
      stop_duration_hours: 1
      coordinates:
        lat: 60.4670
        lon: 7.0718
      transfer_role: short_stop

  - id: transfer_base_2_to_base_3
    from: base_2
    to: base_3
    description: Aurland/Flåm naar Loen/Olden via Fjærland
    estimated_direct_drive_hours: 4.5
    planning_note: "Oversteek via de Laerdaltunnel of Sneeuwweg, door naar Fjærland en de gletsjer."
    max_recommended_major_stops: 2
    en_route_candidates:
    - id: boyabreen_glacier
      name: Bøyabreen-gletsjer
      priority: highly_recommended
      type: glacier_viewpoint
      stop_duration_hours: 1
      coordinates:
        lat: 61.5000
        lon: 6.7500
      transfer_role: candidate

  - id: transfer_base_3_to_bergen
    from: base_3
    to: bergen_ferry
    description: Loen / Stryn naar Bergen
    estimated_direct_drive_hours: 5.5
    planning_note: "Laatste dagrit met veerbootoversteek over de Sognefjord en stop bij Tvindefossen."
    max_recommended_major_stops: 2
    en_route_candidates:
    - id: tvindefossen
      name: Tvindefossen
      priority: highly_recommended
      type: waterfall
      stop_duration_hours: 0.5
      coordinates:
        lat: 60.7260
        lon: 6.4910
      transfer_role: candidate
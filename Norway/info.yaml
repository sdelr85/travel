trip:
  country: Norway
  overview:
    rank: 4
    summary: >
      13-daagse familie-autoreis vanuit België via Hirtshals naar Noorwegen,
      met drie bases in Telemark, Sognefjord en Nordfjord en retour via de
      ferry Bergen-Hirtshals.
    summary_reason: >-
      Het fjordenland van Noorwegen is een van de meest spectaculaire plekken van Europa, en het feit dat het vanuit België per auto bereikbaar is, maakt het extra aantrekkelijk. Nærøyfjord, Geirangerfjord en de Loen Skylift bieden bij elke bocht wereldklasse scenerie. De ferryverbindingen via Hirtshals maken de reis comfortabeler en beperken het aantal lange transitdagen, terwijl het hele gezin vanaf vertrek volledig ondergedompeld wordt in Scandinavische landschappen.
    transport: "🚗Eigen auto"
    duration_days: 14
    travel_style: "Familie roadtrip vanuit België"
    highlights:
      - Ferry Hirtshals-Kristiansand
      - Telemark en Hardangervidda
      - Sognefjord, Nærøyfjord en Aurlandsfjord
      - Nordfjord, Loen Skylift en Geirangerfjord
      - Bergen als afsluiter van de reis
      - Ferry Bergen-Hirtshals
    cost:
      couple:
        eur_range: "€3,000 - €6,000"
      family:
        eur_range: "€5,000 - €8,000"
      relative_costs: "low"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: belgium_hirtshals_telemark_aurland_loen_bergen
  travel_style: family_self_drive

  target_group:
    adults: 2
    children: 3

  transport_constraints:

    international_ferries_to_norway: true

    ferry_to_norway:
      route: Hirtshals-Kristiansand

    international_ferries_back_to_belgium: true

    ferry_back:
      route: Bergen-Hirtshals

    route_to_norway: >
      Belgium -> Germany -> Denmark -> Hirtshals ->
      Kristiansand -> Telemark

    route_back_to_belgium: >
      Loen -> Bergen -> Hirtshals -> Germany -> Belgium

    norwegian_local_car_ferries:
      allowed: true

    tourist_boats_or_fjord_cruises:
      allowed: optional

  duration:
    norway_base_nights: 12
    norway_base_days: 13

    base_locations: 3

    nights_per_base: 4

    international_access_days:
      outbound_to_norway: 1
      return_to_belgium: 1

      note: >
        Overnachting in Hirtshals voor vertrek.
        Aankomst in Noorwegen dezelfde dag als de ferry.
        Na de ferry Bergen-Hirtshals volgt nog één lange rijdag
        terug naar België.
  
  access_plan:

    from: Belgium
    by: own_car

    outbound:

      day_1:
        route:
          - Belgium
          - Germany
          - Hirtshals

        overnight: Hirtshals

        planning_note: >
          Lange verplaatsingsdag. Overnacht dicht bij de ferryterminal
          zodat de ferry de volgende ochtend zonder stress gehaald wordt.

      day_2:
        route:
          - Hirtshals
          - Kristiansand
          - Telemark

        ferry:
          route: Hirtshals-Kristiansand

        planning_note: >
          Na aankomst in Kristiansand rechtstreeks richting Telemark.
          Eventueel een korte stop onderweg.

    return:

      day_13:
        route:
          - Hirtshals
          - Germany
          - Belgium

        planning_note: >
          Vroege aankomst in Hirtshals na de nachtferry vanuit Bergen.
          Vervolgens volledige rit naar België.

  final_stop:
    id: bergen_ferry
    name: Bergen

    coordinates:
      lat: 60.3913
      lon: 5.3221

    planning_note: >
      Laatste stop van de rondreis voor inscheping op de ferry naar
      Hirtshals.

    attractions:
      - id: bryggen
        name: Bryggen
        priority: must_do

      - id: floyen
        name: Fløyen
        priority: must_do

      - id: fish_market
        name: Fish Market
        priority: highly_recommended
  
  planning_principles:
    lodging_strategy:
      note: >
        Gebruik drie bases van vier nachten.
        Telemark blijft bewust behouden als eerste basis omdat dit een
        mooie landschappelijke opbouw creëert:
        Telemark -> Sognefjord -> Nordfjord/Geiranger.
  priority_definitions:
    must_do:
      score: 4
      description: "Absoluut hoogtepunt. Probeer dit op te nemen, tenzij het weer of de timing dit onrealistisch maken."
    highly_recommended:
      score: 3
      description: "Sterk aanbevolen als het weer goed is en het dagschema het toelaat."
    if_time:
      score: 2
      description: "Goede aanvulling, maar niet essentieel."
    optional_paid_activity:
      score: 1
      description: "Het overwegen waard, maar niet essentieel en moet bewust worden gekozen."

  lodging_locations:

  - id: base_1
    name: Rjukan / Gausta / Telemark
    region: Toegang tot Telemark, Gaustatoppen en Hardangervidda
    stay_nights: 4
    coordinates:
      lat: 59.8789
      lon: 8.5941
    lodging_preference_note: "Rjukan is practical for Gaustatoppen, Vemork and Telemark sights. Gaustablikk/Gausta is more scenic and mountain-oriented."
    planning_note: >
      Telemark blijft bewust behouden als eerste basis ondanks de ferryverbinding
      via Kristiansand. De regio vormt een mooie overgang van Zuid-Noorwegen naar
      de fjordenregio's en biedt een combinatie van bergen, cultuur en relatief
      rustige natuurgebieden.
    base_attractions:
    - id: gaustatoppen
      name: Gaustatoppen
      priority: must_do
      type: mountain_hike_viewpoint
      visit_duration_hours: 5
      drive_time_minutes: 25
      coordinates:
        lat: 59.8540
        lon: 8.6490
      difficulty: moderate
      visit_strategy:
        primary_base: base_1
        notes: "Iconisch uitzichtpunt op de bergen. Kan worden gewandeld, of gedeeltelijk vereenvoudigd met Gaustabanen als deze actief is en als u deze als betaalde activiteit kiest."

    - id: gaustabanen
      name: Gaustabanen
      priority: optional_paid_activity
      type: mountain_railway_viewpoint
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 59.8540
        lon: 8.6490
      visit_strategy:
        primary_base: base_1
        notes: "Handig als het gezin het Gaustatoppen-uitzicht wil zonder een volledige wandeling. Weersafhankelijk."

    - id: vemork_museum
      name: Vemork / Noors Industriearbeidersmuseum
      priority: highly_recommended
      type: museum_history
      visit_duration_hours: 2.5
      drive_time_minutes: 15
      coordinates:
        lat: 59.8719
        lon: 8.4910
      visit_strategy:
        primary_base: base_1
        notes: "Sterke regenachtige dag of op geschiedenis gerichte optie in de buurt van Rjukan."

    - id: rjukan_town
      name: Rjukan
      priority: highly_recommended
      type: town_mountain_valley
      visit_duration_hours: 2
      drive_time_minutes: 0
      coordinates:
        lat: 59.8789
        lon: 8.5941
      visit_strategy:
        primary_base: base_1
        notes: "Handig voor boodschappen, restaurants en lichte bezienswaardigheden."

    - id: krossobanen
      name: Krossobanen-kabelbaan
      priority: highly_recommended
      type: cable_car_viewpoint
      visit_duration_hours: 2
      drive_time_minutes: 10
      coordinates:
        lat: 59.8817
        lon: 8.5085
      visit_strategy:
        primary_base: base_1
        notes: "Gezinsvriendelijke uitkijkpuntactiviteit vanuit de Rjukan-vallei. Betaalde activiteitskandidaat."

    - id: hardangervidda_national_park
      name: Toegang tot het Hardangervidda Nationaal Park
      priority: highly_recommended
      type: plateau_scenic_drive_hike
      visit_duration_hours: 4
      drive_time_minutes: 45
      coordinates:
        lat: 60.0000
        lon: 7.5000
      visit_strategy:
        primary_base: base_1
        secondary_opportunity:
        - transfer_kristiansand_to_base_1
        notes: "Goed voor mooie autoritten en kortere wandelingen. Het weer kan snel veranderen."

    - id: telemark_canal
      name: Telemarkkanaal
      priority: if_time
      type: canal_landscape
      visit_duration_hours: 3
      drive_time_minutes: 75
      coordinates:
        lat: 59.2096
        lon: 9.6080
      visit_strategy:
        primary_base: base_1
        notes: "Interessante familie-excursie als je een zachtere landschapsdag wilt, maar minder essentieel dan Gaustatoppen en Vemork."

    - id: heddal_stave_church
      name: Staafkerk van Heddal
      priority: highly_recommended
      type: cultural_site
      visit_duration_hours: 1.5
      drive_time_minutes: 75
      coordinates:
        lat: 59.5797
        lon: 9.1762
      visit_strategy:
        primary_base: base_1
        secondary_opportunity:
        - transfer_kristiansand_to_base_1
        notes: "Een van de meest indrukwekkende staafkerken van Noorwegen. Goede stop tussen Kristiansand en Rjukan als de timing het toelaat."

    arrival_day_candidates:

      route_from: kristiansand

      note: >
        Na aankomst met de ferry rustig richting Telemark rijden.
        Heddal is een goede eerste kennismaking met Noorwegen indien
        de timing het toelaat.

      candidates:
        - external_stop_ref: kristiansand
        - attraction_ref: heddal_stave_church

    departure_day_candidates:
      route_to: base_2
      note: "De route naar Aurland/Flam kan de Hardangervidda doorkruisen en langs watervallen of uitkijkpunten komen. Vermijd het toevoegen van een lange wandeling."
      candidates:
      - attraction_ref: hardangervidda_national_park
      - external_stop_ref: voringsfossen
      - external_stop_ref: eidfjord

  - id: base_2
    name: Aurland / Flam / Voss
    region: Sognefjord, Naeroyfjord en Aurlandsfjord
    stay_nights: 4
    coordinates:
      lat: 60.9080
      lon: 7.1870
    lodging_preference_note: "Aurland is quieter and scenic. Flam is practical but busier. Voss is more central for activities but less fjord-intimate."
    planning_note: "Deze basis omvat klassieke fjord-ervaringen: Naeroyfjord, Aurlandsfjord, Flam Railway, Stegastein en bergwegen. De hoofdreisroute blijft met de auto mogelijk; boot-/veerbootactiviteiten zijn optioneel."

    base_attractions:
    - id: stegastein_viewpoint
      name: Stegastein-uitkijkpunt
      priority: must_do
      type: viewpoint
      visit_duration_hours: 1
      drive_time_minutes: 20
      coordinates:
        lat: 60.9085
        lon: 7.2137
      visit_strategy:
        primary_base: base_2
        good_for_evening_visit: true
        notes: "Zeer eenvoudig, indrukwekkend uitzichtpunt boven de Aurlandsfjord."

    - id: naeroyfjord
      name: Naeroyfjord
      priority: must_do
      type: fjord
      visit_duration_hours: 3
      drive_time_minutes: 25
      coordinates:
        lat: 60.9455
        lon: 6.9504
      visit_strategy:
        primary_base: base_2
        notes: "Het beste te ervaren per cruise, veerboot of kajak, maar dit is een optionele activiteit en geen onderdeel van de transportroute."

    - id: flam_railway
      name: Flam-spoorweg / Flamsbana
      priority: highly_recommended
      type: scenic_train
      visit_duration_hours: 3
      drive_time_minutes: 10
      coordinates:
        lat: 60.8610
        lon: 7.1139
      visit_strategy:
        primary_base: base_2
        notes: "Klassieke schilderachtige spoorwegervaring. Betaalde activiteitskandidaat."

    - id: aurlandsfjellet_snow_road
      name: Aurlandsfjellet schilderachtige weg/sneeuwweg
      priority: highly_recommended
      type: scenic_drive
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 60.9460
        lon: 7.3150
      visit_strategy:
        primary_base: base_2
        secondary_opportunity:
        - transfer_base_2_to_base_3
        notes: "Alternatief bergweg voor de Laerdaltunnel, afhankelijk van opening en weersomstandigheden. Volledig met de auto."

    - id: borgund_stave_church
      name: Borgund staafkerk
      priority: highly_recommended
      type: cultural_site
      visit_duration_hours: 1.5
      drive_time_minutes: 55
      coordinates:
        lat: 61.0471
        lon: 7.8125
      visit_strategy:
        primary_base: base_2
        notes: "Goed cultureel contrast met fjorden en wandelingen."

    - id: undredal
      name: Ondredal
      priority: if_time
      type: fjord_village
      visit_duration_hours: 1.5
      drive_time_minutes: 20
      coordinates:
        lat: 60.9516
        lon: 7.1020
      visit_strategy:
        primary_base: base_2
        notes: "Klein fjorddorp, gemakkelijke stop met weinig moeite."

    - id: viking_valley_gudvangen
      name: Vikingvallei Gudvangen
      priority: if_time
      type: family_cultural_activity
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 60.8783
        lon: 6.8386
      visit_strategy:
        primary_base: base_2
        notes: "Potentieel gezinsvriendelijk cultureel bezoek, vooral bij gemengd weer."

    - id: voss
      name: Vos
      priority: if_time
      type: town_outdoor_activities
      visit_duration_hours: 3
      drive_time_minutes: 65
      coordinates:
        lat: 60.6286
        lon: 6.4147
      visit_strategy:
        primary_base: base_2
        notes: "Goede basis voor optionele betaalde avontuurlijke activiteiten, maar niet essentieel als de betaalde activiteiten beperkt zijn."

    - id: aurlandsdalen
      name: Wandeling door de Aurlandsdalenvallei
      priority: if_time
      type: hike
      visit_duration_hours: 5
      drive_time_minutes: 60
      coordinates:
        lat: 60.8200
        lon: 7.5500
      difficulty: moderate_to_challenging
      visit_strategy:
        primary_base: base_2
        notes: "Mooi, maar moet worden gepland als een echte wandeldag."

    arrival_day_candidates:
      route_from: base_1
      note: "Houd de overdracht vooral schilderachtig. Voeg geen lange wandelingen toe."
      candidates:
      - external_stop_ref: voringsfossen
      - external_stop_ref: eidfjord
      - external_stop_ref: hardanger_bridge

    departure_day_candidates:
      route_to: base_3
      note: "De route naar Loen/Stryn kan Fjaerland en gletsjeruitkijkpunten omvatten."
      candidates:
      - external_stop_ref: laerdal_tunnel_or_snow_road
      - external_stop_ref: boyabreen_glacier
      - external_stop_ref: fjaerland

  - id: base_3
    name: Loen / Olden / Stryn
    region: Nordfjord, gletsjers en toegang tot Geiranger
    stay_nights: 4
    coordinates:
      lat: 61.8716
      lon: 6.8450
    lodging_preference_note: "Loen and Olden are very scenic and close to lakes/glacier trips. Stryn has more services and is practical for Geiranger and Nordfjord."
    planning_note: "Deze basis biedt een dramatisch landschap van meren, gletsjers en fjorden. Geiranger kan over de weg bezocht worden; opties voor veerboot- of fjordcruises blijven optionele activiteiten."

    base_attractions:
    - id: loen_skylift
      name: Loen Skylift / Mount Hoven
      priority: must_do
      type: viewpoint_paid_activity
      visit_duration_hours: 3
      drive_time_minutes: 10
      coordinates:
        lat: 61.8708
        lon: 6.8444
      visit_strategy:
        primary_base: base_3
        notes: "Gezichtspunt met hoge impact. Betaalde activiteit, maar zeer efficiënt en gezinsvriendelijk."

    - id: lake_lovatnet
      name: Het Lovatnet-meer
      priority: must_do
      type: lake_scenic_drive_walk
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 61.8150
        lon: 6.8900
      visit_strategy:
        primary_base: base_3
        notes: "Een van de mooiste, gemakkelijke familie-uitjes in de omgeving."

    - id: briksdalsbreen
      name: Briksdalsbreen-gletsjer
      priority: highly_recommended
      type: glacier_walk
      visit_duration_hours: 3
      drive_time_minutes: 45
      coordinates:
        lat: 61.6646
        lon: 6.8749
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_3
        notes: "Klassieke gletsjerdalwandeling bij Olden."

    - id: oldevatnet
      name: Oldevatnet-meer
      priority: highly_recommended
      type: lake_scenic_drive
      visit_duration_hours: 2
      drive_time_minutes: 30
      coordinates:
        lat: 61.7350
        lon: 6.8200
      visit_strategy:
        primary_base: base_3
        notes: "Goed te combineren met Briksdalsbreen."

    - id: geirangerfjord
      name: Geirangerfjord
      priority: must_do
      type: fjord
      visit_duration_hours: 5
      drive_time_minutes: 120
      coordinates:
        lat: 62.1049
        lon: 7.2050
      visit_strategy:
        primary_base: base_3
        notes: "Langere dagtocht over de weg. Een fjordcruise of veerboot is optioneel en niet vereist om het gebied te bereiken."

    - id: dalsnibba
      name: Dalsnibba/Geiranger Skywalk
      priority: highly_recommended
      type: mountain_viewpoint
      visit_duration_hours: 1.5
      drive_time_minutes: 120
      coordinates:
        lat: 62.0490
        lon: 7.2700
      visit_strategy:
        primary_base: base_3
        notes: "Het beste te combineren met Geiranger-dag als het helder weer is."

    - id: flydalsjuvet
      name: Flydalsjuvet-uitkijkpunt
      priority: highly_recommended
      type: viewpoint
      visit_duration_hours: 0.5
      drive_time_minutes: 115
      coordinates:
        lat: 62.0938
        lon: 7.2320
      visit_strategy:
        primary_base: base_3
        notes: "Korte stop boven Geiranger."

    - id: hjelle
      name: Hjelle en Oppstrynsvatnet
      priority: highly_recommended
      type: village_lake_walk
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 61.9200
        lon: 7.1000
      visit_strategy:
        primary_base: base_3
        notes: "Mooie gemakkelijke familiestop in de buurt van Stryn."

    - id: raksetra
      name: Raksetra / Oppheimsetra-wandeling
      priority: if_time
      type: hike_viewpoint
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 61.8900
        lon: 6.6500
      difficulty: moderate
      visit_strategy:
        primary_base: base_3
        notes: "Goede lokale wandeling met uitzicht op de fjord en de bergen."

    - id: via_ferrata_loen
      name: Via Ferrata Loen
      priority: optional_paid_activity
      type: adventure_activity
      visit_duration_hours: 5
      drive_time_minutes: 10
      coordinates:
        lat: 61.8708
        lon: 6.8444
      difficulty: challenging
      visit_strategy:
        primary_base: base_3
        notes: "Alleen als het gezin een serieuze betaalde avontuurlijke activiteit wil en aan alle leeftijds-/lengtevereisten is voldaan."

    arrival_day_candidates:
      route_from: base_2
      note: "Fjaerland- en gletsjerstops passen goed bij de transfer van Aurland/Flam naar Loen/Stryn."
      candidates:
      - external_stop_ref: fjaerland
      - external_stop_ref: boyabreen_glacier
      - external_stop_ref: gaularfjellet_viewpoint

    departure_day_candidates:

      route_to: bergen_ferry

      note: >
        Laatste dag in Noorwegen.
        Richt je op een comfortabele rit naar Bergen zodat er voldoende
        tijd is om Bryggen en de haven te bezoeken vóór inscheping op
        de avondferry.

      candidates:
        - external_stop_ref: vik
        - external_stop_ref: hopperstad_stave_church
        - external_stop_ref: voss
        - external_stop_ref: bergen

  transfer_routes:

  - id: transfer_kristiansand_to_base_1
    from: kristiansand_ferry
    to: base_1
    description: Kristiansand naar Telemark / Rjukan
    estimated_direct_drive_hours: 3.25
    planning_note: "Na de ferry is dit vooral een aankomsttransfer. Kies maximaal één echte stop, tenzij de overtocht vroeg aankomt."
    max_recommended_major_stops: 1
    en_route_candidates:
    - id: kristiansand
      name: Kristiansand
      priority: if_time
      type: city_or_meal_stop
      stop_duration_hours: 1
      coordinates:
        lat: 58.1467
        lon: 7.9956
      transfer_role: arrival_point

    - attraction_ref: heddal_stave_church
      priority: highly_recommended
      stop_duration_hours: 1.5
      transfer_role: candidate

  - id: transfer_base_1_to_base_2
    from: base_1
    to: base_2
    description: Telemark / Rjukan naar Aurland / Flam via Hardangervidda en Hardanger
    estimated_direct_drive_hours: 5.5
    planning_note: "Een schilderachtige transfer van berg naar fjord. Kies een of twee haltes, bij voorkeur Voringsfossen en een kort uitzichtpunt op de Hardangervidda."
    max_recommended_major_stops: 2
    en_route_candidates:
    - id: hardangervidda_route
      name: Schilderachtige route Hardangervidda
      priority: highly_recommended
      type: scenic_drive_plateau
      stop_duration_hours: 1
      coordinates:
        lat: 60.0000
        lon: 7.5000
      transfer_role: scenic_route

    - id: voringsfossen
      name: Voringsfossen
      priority: must_do
      type: waterfall_viewpoint
      stop_duration_hours: 1
      coordinates:
        lat: 60.4266
        lon: 7.2519
      transfer_role: candidate

    - id: eidfjord
      name: Eidfjord
      priority: if_time
      type: fjord_village_lunch_stop
      stop_duration_hours: 1
      coordinates:
        lat: 60.4670
        lon: 7.0718
      transfer_role: short_stop

    - id: hardanger_bridge
      name: Hardanger-brug
      priority: highly_recommended
      type: scenic_drive
      stop_duration_hours: 0.5
      coordinates:
        lat: 60.4780
        lon: 6.8300
      transfer_role: route_segment

  - id: transfer_base_2_to_base_3
    from: base_2
    to: base_3
    description: Aurland/Flam naar Loen/Olden/Stryn via Sognefjord en Fjaerland
    estimated_direct_drive_hours: 4.5
    planning_note: "Deze transfer kan comfortabel één gletsjerstop of Fjaerland omvatten."
    max_recommended_major_stops: 2
    en_route_candidates:
    - id: laerdal_tunnel_or_snow_road
      name: Laerdaltunnel of Aurlandsfjellet-sneeuwweg
      priority: highly_recommended
      type: route_choice
      stop_duration_hours: 0.5
      coordinates:
        lat: 60.9450
        lon: 7.2500
      transfer_role: route_choice
      planning_note: "Gebruik de Sneeuwweg als deze open is en het weer goed is; gebruik de tunnel als u een snellere/gemakkelijkere overstap wilt."

    - id: fjaerland
      name: Fjaerland
      priority: highly_recommended
      type: fjord_village
      stop_duration_hours: 1.5
      coordinates:
        lat: 61.4047
        lon: 6.7394

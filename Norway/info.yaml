trip:
  country: Norway
  overview:
    rank: 4
    summary: "13-daagse familie-autoreis vanuit België door Denemarken, Zweden en de zuidelijke en structurele fjorden van Noorwegen, zonder internationale veerverbindingen."
    summary_reason: >-
      Het fjordenland van Noorwegen is een van de meest spectaculaire plekken van Europa, en het feit dat het vanuit België per auto bereikbaar is, maakt het extra aantrekkelijk. Nærøyfjord, Geirangerfjord en de Loen Skylift bieden bij elke bocht wereldklasse scenerie, terwijl de route door Denemarken en Zweden de reis zelf tot een onderdeel van het avontuur maakt. Anders dan een vliegbestemming is het hele gezin ondergedompeld in het landschap vanaf het moment dat je thuis vertrekt.
    transport: "🚗Eigen auto"
    duration_days: 13
    travel_style: "Familie roadtrip vanuit België"
    highlights:
    - Kopenhagen / Malmö / Göteborg / Oslo rijroute zonder internationale veerverbindingen
    - Telemark en Hardangervidda als logische eerste basis in Noorwegen
    - Sognefjord, Nærøyfjord en Aurlandsfjord rond Aurland / Flåm
    - Nordfjord, Loen Skylift, gletsjerlandschappen en Geirangerfjord vanuit Loen / Olden / Stryn
    cost:
      couple:
        eur_range: "€3,000 - €6,000"
      family:
        eur_range: "€5,000 - €8,000"
      relative_costs: "low"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: belgium_denmark_sweden_oslo_western_fjords
  travel_style: family_self_drive

  target_group:
    adults: 2
    children: 3

  transport_constraints:
    international_ferries_to_norway: false
    international_ferries_back_to_belgium: false
    route_to_norway: "Belgium -> Germany -> Denmark -> Oresund Bridge -> Sweden -> Oslo -> Norway bases"
    norwegian_local_car_ferries:
      allowed: true
      description: "Er mag gebruik worden gemaakt van korte Noorse wegveerboten als deze deel uitmaken van lokale routes of activiteiten, maar de reis mag niet afhankelijk zijn van veerboten om Noorwegen binnen te komen of te verlaten."
    tourist_boats_or_fjord_cruises:
      allowed: optional
      description: "Fjordcruises, veerboten of kajaks kunnen worden geselecteerd als optionele betaalde activiteiten, maar de hoofdreisroute moet mogelijk blijven met de auto."

  duration:
    norway_base_nights: 12
    norway_base_days: 13
    base_locations: 3
    nights_per_base: 4
    international_access_days:
      outbound_to_norway: 2
      return_to_belgium: 2
      note: "Bij de twaalf basisnachten in Noorwegen wordt ervan uitgegaan dat de lange toegangs- en retourritten afzonderlijk worden afgehandeld, met ten minste één stop in Denemarken of Zweden."

  access_plan:
    from: Belgium
    by: own_car

    outbound_denmark_stop:
      recommended_options:
      - id: copenhagen_stop
        name: Kopenhagen
        country: Denmark
        priority: preferred
        coordinates:
          lat: 55.6761
          lon: 12.5683
        planning_note: "Voorkeursstop bij het vermijden van veerboten, omdat de route natuurlijk verder gaat via de Sontbrug naar Zweden. Beter als gezinsstedentrip dan Odense."

      - id: odense_stop
        name: Odense
        country: Denmark
        priority: practical_alternative
        coordinates:
          lat: 55.4038
          lon: 10.4024
        planning_note: "Praktische overnachtingsplaats als de eerste rijdag vanuit België al lang duurt, maar minder logisch dan Kopenhagen voor een veerbootvrij vervolg via Zweden."

      - id: malmo_stop
        name: Malmö
        country: Sweden
        priority: practical_alternative
        coordinates:
          lat: 55.6050
          lon: 13.0038
        planning_note: "Handig als je bij de eerste toegangsfase de Sontbrug wilt oversteken en net binnen Zweden wilt slapen."

      - id: gothenburg_stop
        name: Göteborg
        country: Sweden
        priority: if_time
        coordinates:
          lat: 57.7089
          lon: 11.9746
        planning_note: "Mogelijke stop tussen Kopenhagen/Malmö en Oslo, maar de heenroute kan er voor zorgen dat de heenroute meer aanvoelt als een doorvoerroute dan als een tussenstop in Denemarken."

    preferred_norway_entry:
      id: sweden_oslo_route
      route:
      - Copenhagen
      - Oresund Bridge
      - Malmo
      - Gothenburg
      - Oslo
      planning_note: "Aanbevolen toegangsroute bij het vermijden van alle internationale veerboten. Oslo wordt een natuurlijke toegangspoort tot Noorwegen en Telemark."

  planning_principles:
    lodging_strategy:
      note: "Gebruik 3 bases van 4 nachten. Omdat de route Noorwegen binnenkomt vanuit Oslo in plaats van Kristiansand of Stavanger, wordt de eerste basis gewijzigd van Stavanger/Jorpeland naar Telemark/Rjukan/Gausta."
    transfer_day:
      max_recommended_major_stops: 2
      max_recommended_sightseeing_hours: 3
      note: "Transferdagen in Noorwegen zijn traag vanwege bergen, fjorden, tunnels, schilderachtige wegen en frequente uitzichtpunten. Houd transferdagen realistisch."
    base_day:
      max_recommended_single_drive_minutes: 120
      note: "De meeste belangrijke bezienswaardigheden moeten worden behandeld als dagtochten vanaf een basis, en niet als transferdagen."
    paid_activities:
      note: "Mogelijke betaalde activiteiten zijn inbegrepen, maar de route kan ook grotendeels worden afgelegd met gratis wandelingen, uitkijkpunten, stadjes en natuurlijke bezienswaardigheden."

  priority_definitions:
    must_do:
      score: 4
      description: "Absoluut hoogtepunt. Probeer dit op te nemen, tenzij het weer of de timing dit onrealistisch maken."
    highly_recommended:
      score: 3
      description: "Sterk aanbevolen als het weer goed is en het dagschema het toelaat."
    if_time:
      score: 2
      description: "Goede aanvulling, maar niet essentieel."
    optional_paid_activity:
      score: 1
      description: "Het overwegen waard, maar niet essentieel en moet bewust worden gekozen."

  lodging_locations:

  - id: base_1
    name: Rjukan / Gausta / Telemark
    region: Toegang tot Telemark, Gaustatoppen en Hardangervidda
    stay_nights: 4
    coordinates:
      lat: 59.8789
      lon: 8.5941
    lodging_preference_note: "Rjukan is practical for Gaustatoppen, Vemork and Telemark sights. Gaustablikk/Gausta is more scenic and mountain-oriented."
    planning_note: "Deze vervangt de basis Stavanger/Jorpeland omdat de reis via Zweden en Oslo met de auto Noorwegen binnenkomt. Het vermijdt een grote omweg naar Stavanger en biedt toch een dramatisch berglandschap en gezinsvriendelijke activiteiten."

    base_attractions:
    - id: gaustatoppen
      name: Gaustatoppen
      priority: must_do
      type: mountain_hike_viewpoint
      visit_duration_hours: 5
      drive_time_minutes: 25
      coordinates:
        lat: 59.8540
        lon: 8.6490
      difficulty: moderate
      visit_strategy:
        primary_base: base_1
        notes: "Iconisch uitzichtpunt op de bergen. Kan worden gewandeld, of gedeeltelijk vereenvoudigd met Gaustabanen als deze actief is en als u deze als betaalde activiteit kiest."

    - id: gaustabanen
      name: Gaustabanen
      priority: optional_paid_activity
      type: mountain_railway_viewpoint
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 59.8540
        lon: 8.6490
      visit_strategy:
        primary_base: base_1
        notes: "Handig als het gezin het Gaustatoppen-uitzicht wil zonder een volledige wandeling. Weersafhankelijk."

    - id: vemork_museum
      name: Vemork / Noors Industriearbeidersmuseum
      priority: highly_recommended
      type: museum_history
      visit_duration_hours: 2.5
      drive_time_minutes: 15
      coordinates:
        lat: 59.8719
        lon: 8.4910
      visit_strategy:
        primary_base: base_1
        notes: "Sterke regenachtige dag of op geschiedenis gerichte optie in de buurt van Rjukan."

    - id: rjukan_town
      name: Rjukan
      priority: highly_recommended
      type: town_mountain_valley
      visit_duration_hours: 2
      drive_time_minutes: 0
      coordinates:
        lat: 59.8789
        lon: 8.5941
      visit_strategy:
        primary_base: base_1
        notes: "Handig voor boodschappen, restaurants en lichte bezienswaardigheden."

    - id: krossobanen
      name: Krossobanen-kabelbaan
      priority: highly_recommended
      type: cable_car_viewpoint
      visit_duration_hours: 2
      drive_time_minutes: 10
      coordinates:
        lat: 59.8817
        lon: 8.5085
      visit_strategy:
        primary_base: base_1
        notes: "Gezinsvriendelijke uitkijkpuntactiviteit vanuit de Rjukan-vallei. Betaalde activiteitskandidaat."

    - id: hardangervidda_national_park
      name: Toegang tot het Hardangervidda Nationaal Park
      priority: highly_recommended
      type: plateau_scenic_drive_hike
      visit_duration_hours: 4
      drive_time_minutes: 45
      coordinates:
        lat: 60.0000
        lon: 7.5000
      visit_strategy:
        primary_base: base_1
        secondary_opportunity:
        - transfer_base_1_to_base_2
        notes: "Goed voor mooie autoritten en kortere wandelingen. Het weer kan snel veranderen."

    - id: telemark_canal
      name: Telemarkkanaal
      priority: if_time
      type: canal_landscape
      visit_duration_hours: 3
      drive_time_minutes: 75
      coordinates:
        lat: 59.2096
        lon: 9.6080
      visit_strategy:
        primary_base: base_1
        notes: "Interessante familie-excursie als je een zachtere landschapsdag wilt, maar minder essentieel dan Gaustatoppen en Vemork."

    - id: heddal_stave_church
      name: Staafkerk van Heddal
      priority: highly_recommended
      type: cultural_site
      visit_duration_hours: 1.5
      drive_time_minutes: 75
      coordinates:
        lat: 59.5797
        lon: 9.1762
      visit_strategy:
        primary_base: base_1
        secondary_opportunity:
        - transfer_oslo_to_base_1
        notes: "Een van de meest indrukwekkende staafkerken van Noorwegen. Goede stop tussen Oslo en Rjukan als de timing het toelaat."

    arrival_day_candidates:
      route_from: oslo_or_sweden
      note: "Na de lange toegangsroute via Denemarken/Zweden/Oslo deze dag gematigd houden. Oslo en Heddal zijn kandidaten, afhankelijk van de timing."
      candidates:
      - external_stop_ref: oslo
      - attraction_ref: heddal_stave_church

    departure_day_candidates:
      route_to: base_2
      note: "De route naar Aurland/Flam kan de Hardangervidda doorkruisen en langs watervallen of uitkijkpunten komen. Vermijd het toevoegen van een lange wandeling."
      candidates:
      - attraction_ref: hardangervidda_national_park
      - external_stop_ref: voringsfossen
      - external_stop_ref: eidfjord

  - id: base_2
    name: Aurland / Flam / Voss
    region: Sognefjord, Naeroyfjord en Aurlandsfjord
    stay_nights: 4
    coordinates:
      lat: 60.9080
      lon: 7.1870
    lodging_preference_note: "Aurland is quieter and scenic. Flam is practical but busier. Voss is more central for activities but less fjord-intimate."
    planning_note: "Deze basis omvat klassieke fjord-ervaringen: Naeroyfjord, Aurlandsfjord, Flam Railway, Stegastein en bergwegen. De hoofdreisroute blijft met de auto mogelijk; boot-/veerbootactiviteiten zijn optioneel."

    base_attractions:
    - id: stegastein_viewpoint
      name: Stegastein-uitkijkpunt
      priority: must_do
      type: viewpoint
      visit_duration_hours: 1
      drive_time_minutes: 20
      coordinates:
        lat: 60.9085
        lon: 7.2137
      visit_strategy:
        primary_base: base_2
        good_for_evening_visit: true
        notes: "Zeer eenvoudig, indrukwekkend uitzichtpunt boven de Aurlandsfjord."

    - id: naeroyfjord
      name: Naeroyfjord
      priority: must_do
      type: fjord
      visit_duration_hours: 3
      drive_time_minutes: 25
      coordinates:
        lat: 60.9455
        lon: 6.9504
      visit_strategy:
        primary_base: base_2
        notes: "Het beste te ervaren per cruise, veerboot of kajak, maar dit is een optionele activiteit en geen onderdeel van de transportroute."

    - id: flam_railway
      name: Flam-spoorweg / Flamsbana
      priority: highly_recommended
      type: scenic_train
      visit_duration_hours: 3
      drive_time_minutes: 10
      coordinates:
        lat: 60.8610
        lon: 7.1139
      visit_strategy:
        primary_base: base_2
        notes: "Klassieke schilderachtige spoorwegervaring. Betaalde activiteitskandidaat."

    - id: aurlandsfjellet_snow_road
      name: Aurlandsfjellet schilderachtige weg/sneeuwweg
      priority: highly_recommended
      type: scenic_drive
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 60.9460
        lon: 7.3150
      visit_strategy:
        primary_base: base_2
        secondary_opportunity:
        - transfer_base_2_to_base_3
        notes: "Alternatief bergweg voor de Laerdaltunnel, afhankelijk van opening en weersomstandigheden. Volledig met de auto."

    - id: borgund_stave_church
      name: Borgund staafkerk
      priority: highly_recommended
      type: cultural_site
      visit_duration_hours: 1.5
      drive_time_minutes: 55
      coordinates:
        lat: 61.0471
        lon: 7.8125
      visit_strategy:
        primary_base: base_2
        notes: "Goed cultureel contrast met fjorden en wandelingen."

    - id: undredal
      name: Ondredal
      priority: if_time
      type: fjord_village
      visit_duration_hours: 1.5
      drive_time_minutes: 20
      coordinates:
        lat: 60.9516
        lon: 7.1020
      visit_strategy:
        primary_base: base_2
        notes: "Klein fjorddorp, gemakkelijke stop met weinig moeite."

    - id: viking_valley_gudvangen
      name: Vikingvallei Gudvangen
      priority: if_time
      type: family_cultural_activity
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 60.8783
        lon: 6.8386
      visit_strategy:
        primary_base: base_2
        notes: "Potentieel gezinsvriendelijk cultureel bezoek, vooral bij gemengd weer."

    - id: voss
      name: Vos
      priority: if_time
      type: town_outdoor_activities
      visit_duration_hours: 3
      drive_time_minutes: 65
      coordinates:
        lat: 60.6286
        lon: 6.4147
      visit_strategy:
        primary_base: base_2
        notes: "Goede basis voor optionele betaalde avontuurlijke activiteiten, maar niet essentieel als de betaalde activiteiten beperkt zijn."

    - id: aurlandsdalen
      name: Wandeling door de Aurlandsdalenvallei
      priority: if_time
      type: hike
      visit_duration_hours: 5
      drive_time_minutes: 60
      coordinates:
        lat: 60.8200
        lon: 7.5500
      difficulty: moderate_to_challenging
      visit_strategy:
        primary_base: base_2
        notes: "Mooi, maar moet worden gepland als een echte wandeldag."

    arrival_day_candidates:
      route_from: base_1
      note: "Houd de overdracht vooral schilderachtig. Voeg geen lange wandelingen toe."
      candidates:
      - external_stop_ref: voringsfossen
      - external_stop_ref: eidfjord
      - external_stop_ref: hardanger_bridge

    departure_day_candidates:
      route_to: base_3
      note: "De route naar Loen/Stryn kan Fjaerland en gletsjeruitkijkpunten omvatten."
      candidates:
      - external_stop_ref: laerdal_tunnel_or_snow_road
      - external_stop_ref: boyabreen_glacier
      - external_stop_ref: fjaerland

  - id: base_3
    name: Loen / Olden / Stryn
    region: Nordfjord, gletsjers en toegang tot Geiranger
    stay_nights: 4
    coordinates:
      lat: 61.8716
      lon: 6.8450
    lodging_preference_note: "Loen and Olden are very scenic and close to lakes/glacier trips. Stryn has more services and is practical for Geiranger and Nordfjord."
    planning_note: "Deze basis biedt een dramatisch landschap van meren, gletsjers en fjorden. Geiranger kan over de weg bezocht worden; opties voor veerboot- of fjordcruises blijven optionele activiteiten."

    base_attractions:
    - id: loen_skylift
      name: Loen Skylift / Mount Hoven
      priority: must_do
      type: viewpoint_paid_activity
      visit_duration_hours: 3
      drive_time_minutes: 10
      coordinates:
        lat: 61.8708
        lon: 6.8444
      visit_strategy:
        primary_base: base_3
        notes: "Gezichtspunt met hoge impact. Betaalde activiteit, maar zeer efficiënt en gezinsvriendelijk."

    - id: lake_lovatnet
      name: Het Lovatnet-meer
      priority: must_do
      type: lake_scenic_drive_walk
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 61.8150
        lon: 6.8900
      visit_strategy:
        primary_base: base_3
        notes: "Een van de mooiste, gemakkelijke familie-uitjes in de omgeving."

    - id: briksdalsbreen
      name: Briksdalsbreen-gletsjer
      priority: highly_recommended
      type: glacier_walk
      visit_duration_hours: 3
      drive_time_minutes: 45
      coordinates:
        lat: 61.6646
        lon: 6.8749
      difficulty: easy_to_moderate
      visit_strategy:
        primary_base: base_3
        notes: "Klassieke gletsjerdalwandeling bij Olden."

    - id: oldevatnet
      name: Oldevatnet-meer
      priority: highly_recommended
      type: lake_scenic_drive
      visit_duration_hours: 2
      drive_time_minutes: 30
      coordinates:
        lat: 61.7350
        lon: 6.8200
      visit_strategy:
        primary_base: base_3
        notes: "Goed te combineren met Briksdalsbreen."

    - id: geirangerfjord
      name: Geirangerfjord
      priority: must_do
      type: fjord
      visit_duration_hours: 5
      drive_time_minutes: 120
      coordinates:
        lat: 62.1049
        lon: 7.2050
      visit_strategy:
        primary_base: base_3
        notes: "Langere dagtocht over de weg. Een fjordcruise of veerboot is optioneel en niet vereist om het gebied te bereiken."

    - id: dalsnibba
      name: Dalsnibba/Geiranger Skywalk
      priority: highly_recommended
      type: mountain_viewpoint
      visit_duration_hours: 1.5
      drive_time_minutes: 120
      coordinates:
        lat: 62.0490
        lon: 7.2700
      visit_strategy:
        primary_base: base_3
        notes: "Het beste te combineren met Geiranger-dag als het helder weer is."

    - id: flydalsjuvet
      name: Flydalsjuvet-uitkijkpunt
      priority: highly_recommended
      type: viewpoint
      visit_duration_hours: 0.5
      drive_time_minutes: 115
      coordinates:
        lat: 62.0938
        lon: 7.2320
      visit_strategy:
        primary_base: base_3
        notes: "Korte stop boven Geiranger."

    - id: hjelle
      name: Hjelle en Oppstrynsvatnet
      priority: highly_recommended
      type: village_lake_walk
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 61.9200
        lon: 7.1000
      visit_strategy:
        primary_base: base_3
        notes: "Mooie gemakkelijke familiestop in de buurt van Stryn."

    - id: raksetra
      name: Raksetra / Oppheimsetra-wandeling
      priority: if_time
      type: hike_viewpoint
      visit_duration_hours: 3
      drive_time_minutes: 20
      coordinates:
        lat: 61.8900
        lon: 6.6500
      difficulty: moderate
      visit_strategy:
        primary_base: base_3
        notes: "Goede lokale wandeling met uitzicht op de fjord en de bergen."

    - id: via_ferrata_loen
      name: Via Ferrata Loen
      priority: optional_paid_activity
      type: adventure_activity
      visit_duration_hours: 5
      drive_time_minutes: 10
      coordinates:
        lat: 61.8708
        lon: 6.8444
      difficulty: challenging
      visit_strategy:
        primary_base: base_3
        notes: "Alleen als het gezin een serieuze betaalde avontuurlijke activiteit wil en aan alle leeftijds-/lengtevereisten is voldaan."

    arrival_day_candidates:
      route_from: base_2
      note: "Fjaerland- en gletsjerstops passen goed bij de transfer van Aurland/Flam naar Loen/Stryn."
      candidates:
      - external_stop_ref: fjaerland
      - external_stop_ref: boyabreen_glacier
      - external_stop_ref: gaularfjellet_viewpoint

    departure_day_candidates:
      route_to: belgium_via_oslo_sweden_denmark
      note: "Terugreis gaat volledig met de auto via Oslo, Zweden, Denemarken en Duitsland. Hiervoor zijn waarschijnlijk minstens twee lange rijdagen nodig na het verlaten van de laatste basis in Noorwegen."
      candidates:
      - external_stop_ref: lillehammer
      - external_stop_ref: oslo
      - external_stop_ref: gothenburg
      - external_stop_ref: copenhagen

  transfer_routes:

  - id: transfer_belgium_to_copenhagen_or_malmo
    from: Belgium
    to: copenhagen_or_malmo_stop
    description: Overnachting van België naar Denemarken of Zuid-Zweden
    planning_note: "Dit is vooral een lange rijdag. Kopenhagen is de meest aantrekkelijke stop als je een echte stedentrip wilt; Malmö is praktisch als je de Sontbrug wilt oversteken voordat je stopt."
    en_route_candidates:
    - id: hamburg
      name: Hamburg
      priority: if_time
      type: city_or_meal_stop
      stop_duration_hours: 2
      coordinates:
        lat: 53.5511
        lon: 9.9937
      transfer_role: short_stop

    - id: odense
      name: Odense
      priority: if_time
      type: practical_overnight_stop
      stop_duration_hours: 12
      coordinates:
        lat: 55.4038
        lon: 10.4024
      transfer_role: overnight_alternative
      planning_note: "Praktisch als België naar Kopenhagen te lang lijkt, maar strategisch minder nuttig voor een veerbootvrije route."

    - id: copenhagen
      name: Kopenhagen
      priority: highly_recommended
      type: city_overnight_stop
      stop_duration_hours: 12
      coordinates:
        lat: 55.6761
        lon: 12.5683
      transfer_role: preferred_overnight
      planning_note: "Beste halte in Denemarken voor deze veerbootvrije route."

    - id: malmo
      name: Malmö
      priority: if_time
      type: city_overnight_stop
      stop_duration_hours: 12
      coordinates:
        lat: 55.6050
        lon: 13.0038
      transfer_role: overnight_alternative
      planning_note: "Goed als je in Zweden wilt slapen nadat je de Sontbrug bent overgestoken."

  - id: transfer_copenhagen_or_malmo_to_base_1
    from: copenhagen_or_malmo_stop
    to: base_1
    description: Denemarken/Zweden naar Telemark via West-Zweden en Oslo
    estimated_direct_drive_hours: 9.0
    planning_note: "Dit is een lange maar veerbootvrije dag. Overweeg indien nodig om te splitsen met een tussenstop in de buurt van Göteborg of Oslo. Als je het op één dag doet, zorg er dan voor dat je de bezienswaardigheden minimaal houdt."
    max_recommended_major_stops: 1
    en_route_candidates:

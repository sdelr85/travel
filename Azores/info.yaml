trip:
  country: Azores

  overview:
    rank: 17
    summary: "12-daagse familie-autoreis door São Miguel en Pico, gericht op vulkanische landschappen, kratermeren, thermale bronnen, watervallen, wandelen, walvissafari en kustlandschap."
    summary_reason: >-
      De Azoren voelen aan als een plek die de rest van de wereld vergeten is - vulkanische caldera's gevuld met jadegroen water, natuurlijke hete bronnen die borrelen uit de grond, watervallen sterven direct in de oceaanstorten en een van de beste walvissafariroutes ter wereld. Anders dan IJsland of de Canarische Eilanden voelt de eilanden echt wild en weinig bezocht, met een dramatisch vulkanisch landschap dat wandelaars en natuurliefhebbers boven alles beloont.
    transport: "✈ Vliegtuig + 🚗 Huurauto + ✈ Vlucht tussen de eilanden"

    duration_days: 12
    duration_nights: 11

    travel_style: "Fly-in familie-selfdrive"

    highlights:
    - Sete Cidades
    - Lagoa do Fogo
    - Geothermisch gebied Furnas
    - Terra Nostra thermale baden
    - Walvissafari
    - Monte Pico
    - Wijnlandschap van Pico
    - Natuurlijke lavazwembaden
    cost:
      couple:
        eur_range: "€4,000 - €7,000"
      family:
        eur_range: "€7,000 - €11,000"
      relative_costs: "medium"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: sao_miguel_then_pico

  duration:

    days: 12
    nights: 11

    base_locations: 2

    recommended_base_split:

    - base: base_1
      nights: 6

    - base: base_2
      nights: 5

  transport_constraints:

    rental_car:
      recommended: true

    inter_island_flights:
      recommended: true

    ferries:
      optional: true

  planning_principles:

    lodging_strategy:
      note: >-
        Verblijf in één accommodatie per eiland. Sao Miguel en Pico bieden voldoende variatie dat extra accommodatielocaties de complexiteit vergroten zonder substantiële voordelen.

    transfer_day:
      max_recommended_major_stops: 2
      max_recommended_sightseeing_hours: 3

    base_day:
      max_recommended_single_drive_minutes: 60

    weather_flexibility:
      note: >-
        Het weer verandert snel op de Azoren. Houd uitzichtpunten en wandelingen flexibel.

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  lodging_locations:

  - id: base_1


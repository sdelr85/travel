trip:
  country: Azores

  overview:
    rank: 16
    summary: "12-day family fly-in self-drive trip through Sao Miguel and Pico, focused on volcanic landscapes, crater lakes, thermal pools, waterfalls, hiking, whale watching and coastal scenery."
    summary_reason: >
      A relaxed volcanic island adventure with crater lakes, thermal pools, waterfalls, whale watching and excellent hiking.
    transport: "✈ Plane + 🚗 Rental car + ✈ Inter-island flight"

    duration_days: 12
    duration_nights: 11

    travel_style: "Fly-in family self-drive"

    highlights:
      - "Sete Cidades"
      - "Lagoa do Fogo"
      - "Furnas geothermal area"
      - "Terra Nostra thermal baths"
      - "Whale watching"
      - "Mount Pico"
      - "Pico wine landscape"
      - "Natural lava pools"

    cost:
      couple:
        eur_range: "€4,000 - €7,000"
      family:
        eur_range: "€7,000 - €11,000"
      relative_costs: "medium"
      assumptions:
        - "Mid-range accommodations"
        - "Peak summer season"
        - "Flights/Car rental included (if relevant)"
        - "Normal restaurant usage"
        - "Limited paid excursions (1-2 per base)"

  direction: sao_miguel_then_pico

  duration:

    days: 12
    nights: 11

    base_locations: 2

    recommended_base_split:

      - base: base_1
        nights: 6

      - base: base_2
        nights: 5

  transport_constraints:

    rental_car:
      recommended: true

    inter_island_flights:
      recommended: true

    ferries:
      optional: true

  planning_principles:

    lodging_strategy:
      note: >
        Stay in one accommodation per island.
        Sao Miguel and Pico offer enough variety that additional lodging locations
        add complexity without substantial benefit.

    transfer_day:
      max_recommended_major_stops: 2
      max_recommended_sightseeing_hours: 3

    base_day:
      max_recommended_single_drive_minutes: 60

    weather_flexibility:
      note: >
        Weather changes rapidly in the Azores.
        Keep viewpoints and hikes flexible.

  priority_definitions:

    must_do:
      score: 4

    highly_recommended:
      score: 3

    if_time:
      score: 2

    optional_paid_activity:
      score: 1

  lodging_locations:

    - id: base_1

      name: Furnas / Sao Miguel

      region: Sao Miguel

      stay_nights: 6

      coordinates:
        lat: 37.7930
        lon: -25.3237

      planning_note: >
        Excellent location near geothermal activity while still allowing easy access
        to the full island.

      base_attractions:

        - id: sete_cidades

          name: Sete Cidades

          priority: must_do

          type: volcanic_caldera

          visit_duration_hours: 4

          coordinates:
            lat: 37.8617
            lon: -25.7285

        - id: vista_do_rei

          name: Vista do Rei Viewpoint

          priority: must_do


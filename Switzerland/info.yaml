trip:
  country: Switzerland

  overview:
    rank: 14
    summary: "14-daagse familie-autoreis door het Berner Oberland en de Matterhorn-streek."
    summary_reason: >-
      Zwitserland verplaatsing een van Europa's meest spectaculaire berglandschappen, kristalheldere meren, gletsjers, watervallen en zeer toegankelijke alpenwandelingen. De combinatie van het Lauterbrunnen-dal, het Oeschinenmeer, de Jungfrau-regio en de Matterhorn maakt het een van de mooiste bergreizen ter wereld.
    transport: "🚗Eigen auto"
    duration_days: 14
    travel_style: "Familie alpine vakantie"
    highlights:
    - Lauterbrunnen-dal
    - Oeschinenmeer
    - Grindelwald eerst
    - Jungfrau-regio
    - Matterhorn
    - Gornergrat
    - Aletsch Gletsjer
    cost:
      couple:
        eur_range: "€4,000 - €7,000"
      family:
        eur_range: "€6,000 - €11,000"
      relative_costs: "medium"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  duration:
    days: 14
    nights: 13

  lodging_locations:

  - id: base_1

    name: Lauterbrunnen / Wengen
    region: Berner Oberland
    stay_nights: 7

    coordinates:
      lat: 46.5930
      lon: 7.9090

    planning_note: >-
      Eersteklas Zwitserse bergbasis. Bestrijkt het grootste deel van het iconische landschap van het Berner Oberland.

    base_attractions:

    - id: lauterbrunnen_valley
      name: Lauterbrunnenvallei
      priority: must_do
      type: valley
      visit_duration_hours: 4
      coordinates:
        lat: 46.5930
        lon: 7.9090

    - id: staubbach_falls
      name: Staubbach-watervallen
      priority: must_do

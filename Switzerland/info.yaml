    from: base_1
    to: base_2

    description: Berner Oberland naar Zermatt
    estimated_direct_drive_hours: 3

    planning_note: >-
      Schilderachtige transfer door de Zwitserse Alpen. Beperk bezienswaardigheden tot een of twee zinvolle stops.

    en_route_candidates:

    - attraction_ref: aletsch_glacier

    - id: brig
      name: Brig

  paid_activity_preferences:

    intended_paid_activities:
    - gornergrat
    - grindelwald_first
    possible_second_paid_activity:
    - jungfraujoch
    - matterhorn_glacier_paradise
    planning_note: >-
      Zwitserland kan snel duur worden. Geef prioriteit aan uitkijkspoorwegen en kabelbanen boven andere betaalde activiteiten.

  access:

    type: own_car_from_belgium

    approximate_driving_days:
      outbound: 1
      return: 1

    planning_note: >-
      De rit vanuit België is eenvoudig. Overweeg alleen een overnachting als u de voorkeur geeft aan een zeer ontspannen reis.

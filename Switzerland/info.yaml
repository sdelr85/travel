trip:
  country: Switzerland

  overview:
    rank: 14
    summary: "14-daagse familie-autoreis door het Berner Oberland en de Matterhorn-streek."
    summary_reason: >
      Zwitserland combineert een van Europa's meest spectaculaire berglandschappen, kristalheldere meren,
      gletsjers, watervallen en zeer toegankelijke alpenwandelingen. De combinatie van het Lauterbrunnen-dal,
      het Oeschinenmeer, de Jungfrau-regio en het Matterhorn maakt het een van de mooiste bergreizen
      ter wereld.
    transport: "🚗 Own car"
    duration_days: 14
    travel_style: "Family alpine vacation"
    highlights:
      - "Lauterbrunnen-dal"
      - "Oeschinenmeer"
      - "Grindelwald First"
      - "Jungfrau-regio"
      - "Matterhorn"
      - "Gornergrat"
      - "Aletsch Gletsjer"
    cost:
      couple:
        eur_range: "€4,000 - €7,000"
      family:
        eur_range: "€6,000 - €11,000"
      relative_costs: "medium"
      assumptions:
        - "Mid-range accommodations"
        - "Peak summer season"
        - "Flights/Car rental included (if relevant)"
        - "Normal restaurant usage"
        - "Limited paid excursions (1-2 per base)"

  duration:
    days: 14
    nights: 13

  lodging_locations:


      priority: highly_recommended
      type: waterfall
      visit_duration_hours: 2
      coordinates:
        lat: 46.5724
        lon: 7.9117

    - id: mannlichen
      name: Mannlichen
      priority: must_do
      type: hiking
      visit_duration_hours: 4
      coordinates:
        lat: 46.6180

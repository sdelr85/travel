      lon: -20.9970

    planning_note: "Goede eerste basis na aankomst. Gebruik deze uitvalsbasis voor Golden Circle, een warmwaterbronwandeling of -bad en een ontspannen eerste IJsland-ervaring."

    base_attractions:

    - id: thingvellir
      name: Thingvellir Nationaal Park
      priority: must_do
      type: nature_history
      visit_duration_hours: 3
      drive_time_minutes: 45
      coordinates:
        lat: 64.2559
        lon: -21.1295
      visit_strategy:
        primary_base: base_1
        good_for_evening_visit: false
        notes: "Het beste te combineren met Geysir en Gullfoss als onderdeel van de Golden Circle."

    - id: geysir_strokkur

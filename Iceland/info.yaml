trip:
  country: Iceland
  overview:
    rank: 3
    summary: "13-daagse autoreis tegen de klok in over de ringweg van IJsland langs de meest iconische landschappen."
    summary_reason: >-
      IJsland is de eindbestemming op deze lijst waar het land zelf nog onaf trekkelijk is - actieve vulkanen die de kustlijnvormen, geisers die op vaste tijden uitbarsten, gletsjers waar je op kunt wandelen en noorderlicht boven je hoofd in de winter. De ringweg brengt wereldklasse watervallen, zwarte zandstranden, gletsjerlagunen en walvisspotten binnen bereik van één enkele rondrit van twee weken, met geen last op de wegen en een rauwe, elementaire sfeer die geen andere Europese bestemming in de buurt kan komen.
    transport: "✈ Vliegtuig + 🚗 Huurauto"
    duration_days: 13
    travel_style: "Fly-in familie-selfdrive"
    highlights:
    - Gouden Cirkel (Þingvellir, Geysir, Gullfoss)
    - Zuidkust (watervallen, zwarte stranden, gletsjers)
    - Noord-IJsland (Mývatn, Dettifoss, Húsavík)
    - Snaæfellsnes Schiereiland
    cost:
      couple:
        eur_range: "€5,000 - €8,000"
      family:
        eur_range: "€8,000 - €13,000"
      relative_costs: "high"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  direction: counter_clockwise
  duration:
    days: 13
    nights: 12

  planning_principles:
    transfer_day:
      max_recommended_sightseeing_hours: 3
      max_recommended_major_stops: 2
      note: "Transferdagen moeten vooral worden gebruikt voor autorijden, korte stops en flexibiliteit. Plan op deze dagen niet te veel bezoeken van 1-2 uur."
    base_day:
      max_recommended_single_drive_minutes: 105
      note: "De meeste belangrijke bezienswaardigheden moeten worden gepland als dagtochten vanuit de accommodatiebases."
    flexibility:
      note: "Sommige locaties zijn zowel basisattracties als kandidaten voor een transferdag. Gebruik het weer, de inchecktijd en het energieniveau van het gezin om te beslissen."

  priority_definitions:
    must_do:
      score: 4
      description: "Absoluut hoogtepunt. Probeer dit op te nemen, tenzij het weer of de timing dit onrealistisch maken."
    highly_recommended:
      score: 3
      description: "Sterk aanbevolen als het weer goed is en het dagschema het toelaat."
    if_time:
      score: 2
      description: "Goede aanvulling, maar niet essentieel."
    optional_paid_activity:
      score: 1
      description: "Het overwegen waard, maar moet beperkt zijn vanwege budget en planningsvoorkeur."

  lodging_locations:

  - id: base_1

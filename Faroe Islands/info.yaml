trip:
  country: Faroe Islands

  overview:
    rank: 13
    summary: "10-day family fly-in self-drive trip through the Faroe Islands, focused on dramatic landscapes, hikes, villages, sea cliffs, waterfalls and one or two optional island/boat activities."
    summary_reason: >
      A compact but incredibly photogenic destination combining dramatic cliffs, waterfalls, ocean scenery and remote island adventure.
    transport: "✈ Plane + 🚗 Rental car"
    duration_days: 10
    duration_nights: 9
    travel_style: "Fly-in family self-drive"
    recommended_season: "June to August for longest daylight, better hiking access and best chance for Mykines/puffins, while keeping weather flexibility."
    highlights:
      - "Vagar: Mulafossur, Lake Sorvagsvatn/Leitisvatn, Bosdalafossur and Drangarnir views"
      - "Northern islands: Klaksvik, Kalsoy, Kallur Lighthouse, Vidareidi and Kunoy"
      - "Eysturoy and Streymoy: Saksun, Tjornuvik, Gjogv, Funningur and Eidi"
      - "Torshavn and nearby islands: Kirkjubour, Nolsoy or Sandoy"
      - "Optional Mykines or Vestmanna sea cliffs depending on weather"
    target_group:
      adults: 2
      children: 3

  direction: vagar_torshavn_northern_islands_eysturoy_streymoy
  travel_style: family_self_drive

  cost:
      couple:
        eur_range: "€4,000 - €7,000"
      family:
        eur_range: "€7,000 - €11,000"
      relative_costs: "medium"
      assumptions:
        - "Mid-range accommodations"
        - "Peak summer season"
        - "Flights/Car rental included (if relevant)"
        - "Normal restaurant usage"
        - "Limited paid excursions (1-2 per base)"

  duration:
    days: 10
    nights: 9
    base_locations: 3
    recommended_base_split:
      - base: base_1
        nights: 3
      - base: base_2
        nights: 3
      - base: base_3
        nights: 3
    alternative_base_split_if_8_nights:
      - base: base_1
        nights: 2
      - base: base_2
        nights: 3
      - base: base_3
        nights: 3
    note: "The Faroe Islands are compact but weather-sensitive. Three bases of three nights gives enough flexibility without too much packing and unpacking."

  access_plan:
    from: Belgium
    by: plane
    airport:
      id: vagar_airport
      name: Vagar Airport
      coordinates:
        lat: 62.0636
        lon: -7.2772
      planning_note: "The only airport in the Faroe Islands is on Vagar. From here it is easy to start with Vagar attractions before moving east."
    rental_car:
      recommended: true
      planning_note: "A rental car is strongly recommended for a family trip because rural buses are less flexible and weather often forces day-by-day changes."

  transport_constraints:
    subsea_tunnels:
      allowed: true
      planning_note: "Several main islands are connected by tolled subsea tunnels. Rental companies often settle tunnel tolls, but this should be checked when booking."
    local_ferries:
      allowed: optional
      planning_note: "Some islands still need ferries, especially Kalsoy and Mykines. Ferries are weather-dependent and should not be planned as the only highlight of the trip."
    helicopter:
      allowed: optional
      planning_note: "The helicopter network can be scenic but seats are limited and it should be treated as a bonus rather than the backbone of the itinerary."
    weather_flexibility:
      required: true
      planning_note: "Wind, fog and rain can change plans quickly. Keep backup activities close to each base."

  planning_principles:
    lodging_strategy:
      note: "Use 3 bases: Vagar for arrival and western sights, Klaksvik/Northern Islands for Kalsoy and the north, and Torshavn or central Streymoy for Streymoy/Eysturoy/Sandoy and departure flexibility."
    transfer_day:
      max_recommended_major_stops: 2
      max_recommended_sightseeing_hours: 3
      note: "Distances are shorter than Iceland or Norway, but weather, single-lane roads, tunnels and photo stops mean transfer days should still be kept light."
    base_day:
      max_recommended_single_drive_minutes: 75
      note: "Most sightseeing should be done as short day trips from the base. Several days should keep morning/afternoon alternatives because of weather."
    paid_activities:
      note: "Main paid activity candidates are Mykines, Vestmanna sea cliffs, a Drangarnir/Tindholmur tour or a guided hike. Pick one or two maximum."

  priority_definitions:
    must_do:
      score: 4
      description: "Absolute highlight. Try to include unless weather, ferry cancellation or safety conditions make it unrealistic."
    highly_recommended:
      score: 3
      description: "Strongly recommended if weather is good and the day schedule allows it."
    if_time:
      score: 2
      description: "Good addition, but not essential."
    optional_paid_activity:
      score: 1
      description: "Worth considering, but should be selected deliberately because of budget, weather dependency and booking constraints."

  lodging_locations:

    - id: base_1
      name: Vagar / Sorvagur / Gasadalur
      region: Vagar and western Faroe Islands
      stay_nights: 3
      coordinates:
        lat: 62.0717
        lon: -7.3070
      lodging_preference_note: "Sorvagur is practical for the airport, Mykines boat and western Vagar sights. Gasadalur is very scenic but more remote."
      planning_note: "Best first base after arrival. Use this base for Mulafossur, Sorvagsvatn/Leitisvatn, Bosdalafossur and optional Mykines or Drangarnir."

      base_attractions:
        - id: mulafossur_waterfall
          name: Mulafossur Waterfall and Gasadalur
          priority: must_do
          type: waterfall_village_viewpoint
          visit_duration_hours: 1.5
          drive_time_minutes: 20
          coordinates:
            lat: 62.1049
            lon: -7.4347
          visit_strategy:
            primary_base: base_1
            good_for_evening_visit: true
            notes: "Iconic waterfall dropping toward the sea. Easy and high-impact first or last evening stop on Vagar."

        - id: sorvagsvatn_leitisvatn
          name: Sorvagsvatn / Leitisvatn Lake Viewpoint
          priority: must_do
          type: hike_viewpoint
          visit_duration_hours: 3
          drive_time_minutes: 15
          coordinates:
            lat: 62.0420
            lon: -7.1990
          difficulty: easy_to_moderate
          visit_strategy:
            primary_base: base_1
            notes: "Famous optical illusion lake-above-the-ocean viewpoint. Combine with Bosdalafossur if weather is clear."

        - id: bosdalafossur
          name: Bosdalafossur Waterfall
          priority: highly_recommended
          type: waterfall_hike
          visit_duration_hours: 1
          drive_time_minutes: 15
          coordinates:
            lat: 62.0128
            lon: -7.2175
          visit_strategy:
            primary_base: base_1
            notes: "Best combined with the Sorvagsvatn/Leitisvatn hike."

        - id: bour_village
          name: Bour Village and Tindholmur Views
          priority: highly_recommended
          type: village_viewpoint
          visit_duration_hours: 1
          drive_time_minutes: 10
          coordinates:
            lat: 62.0906
            lon: -7.3686
          visit_strategy:
            primary_base: base_1
            notes: "Small village with excellent views toward Tindholmur and Drangarnir."

        - id: drangarnir_tindholmur
          name: Drangarnir and Tindholmur View / Tour
          priority: optional_paid_activity
          type: guided_hike_or_boat_tour
          visit_duration_hours: 4
          drive_time_minutes: 10
          coordinates:
            lat: 62.0770
            lon: -7.4180
          visit_strategy:
            primary_base: base_1
            notes: "Spectacular but usually requires a guided hike or boat tour. Consider only if weather and budget allow."

        - id: mykines_day_trip
          name: Mykines Day Trip
          priority: optional_paid_activity
          type: island_ferry_hike_puffins
          visit_duration_hours: 6
          drive_time_minutes: 5
          coordinates:
            lat: 62.1025
            lon: -7.6450
          visit_strategy:
            primary_base: base_1
            notes: "Very attractive in puffin season, but ferry and access are weather-dependent. Keep a backup plan on Vagar."

      arrival_day_candidates:
        route_from: vagar_airport
        note: "Keep arrival day simple. Mulafossur or Bour are ideal first-day stops if the flight arrives early enough."
        candidates:
          - attraction_ref: mulafossur_waterfall
          - attraction_ref: bour_village

      departure_day_candidates:
        route_to: base_2
        note: "Transfer to the northern islands is not long, but use it for one central Streymoy or Eysturoy stop if weather is good."
        candidates:
          - external_stop_ref: vestmanna_sea_cliffs
          - external_stop_ref: saksun

    - id: base_2
      name: Klaksvik / Northern Islands
      region: Bordoy, Kalsoy, Kunoy and Vidoy
      stay_nights: 3
      coordinates:
        lat: 62.2266
        lon: -6.5890
      lodging_preference_note: "Klaksvik is the practical base because it has services and the ferry to Kalsoy. Rural stays in the northern islands are scenic but less flexible."
      planning_note: "Use this base for Kalsoy and Kallur Lighthouse, Vidareidi, Kunoy and dramatic northern island drives."

      base_attractions:
        - id: kallur_lighthouse
          name: Kallur Lighthouse Hike
          priority: must_do
          type: ferry_hike_viewpoint
          visit_duration_hours: 5
          drive_time_minutes: 15
          coordinates:
            lat: 62.3730
            lon: -6.7890
          difficulty: moderate
          visit_strategy:
            primary_base: base_2
            notes: "One of the top Faroe views. Requires ferry to Kalsoy and suitable weather. Do not schedule as the only possible highlight of the base."

        - id: mikladalur_seal_woman
          name: Mikladalur and Seal Woman Statue
          priority: highly_recommended
          type: village_coast
          visit_duration_hours: 1.5
          drive_time_minutes: 20
          coordinates:
            lat: 62.3340
            lon: -6.7670
          visit_strategy:
            primary_base: base_2
            notes: "Good add-on to Kalsoy day."

        - id: vidareidi
          name: Vidareidi
          priority: must_do
          type: village_mountain_viewpoint
          visit_duration_hours: 2
          drive_time_minutes: 30
          coordinates:
            lat: 62.3605
            lon: -6.5310
          visit_strategy:
            primary_base: base_2
            notes: "Beautiful northern village surrounded by high mountains and sea views."

        - id: kunoy
          name: Kunoy Village and Kunoy Park
          priority: highly_recommended
          type: village_short_walk
          visit_duration_hours: 1.5
          drive_time_minutes: 20
          coordinates:
            lat: 62.3030
            lon: -6.6470
          visit_strategy:
            primary_base: base_2
            notes: "Quiet and scenic short visit from Klaksvik."

        - id: klakkur_hike
          name: Klakkur Hike above Klaksvik
          priority: highly_recommended
          type: short_hike_viewpoint
          visit_duration_hours: 2.5
          drive_time_minutes: 10
          coordinates:
            lat: 62.2450
            lon: -6.6020
          difficulty: easy_to_moderate
          visit_strategy:
            primary_base: base_2
            notes: "Excellent local hike with views over Klaksvik and surrounding islands. Good backup if Kalsoy ferry is not suitable."

        - id: hvannasund
          name: Hvannasund
          priority: if_time
          type: village_drive
          visit_duration_hours: 1
          drive_time_minutes: 25
          coordinates:
            lat: 62.2960
            lon: -6.5150
          visit_strategy:
            primary_base: base_2
            notes: "Short northern-islands scenic drive option."

      arrival_day_candidates:
        route_from: base_1
        note: "If transferring from Vagar, you can add Saksun, Tjornuvik or Eysturoy if weather is good, but keep Kalsoy for a dedicated day."
        candidates:
          - external_stop_ref: saksun
          - external_stop_ref: tjornuvik
          - external_stop_ref: eysturoyartunnilin

      departure_day_candidates:
        route_to: base_3
        note: "Use departure day for Gjogv, Funningur or Eidi on the way to Torshavn/Streymoy."
        candidates:
          - external_stop_ref: gjogv
          - external_stop_ref: funningur
          - external_stop_ref: eidi

    - id: base_3
      name: Torshavn / Central Streymoy
      region: Streymoy, Eysturoy and southern islands
      stay_nights: 3
      coordinates:
        lat: 62.0079
        lon: -6.7900
      lodging_preference_note: "Torshavn gives the most flexibility, restaurants and backup options in bad weather. A rural Streymoy stay is more scenic but less practical."
      planning_note: "Use this base for Torshavn, Kirkjubour, Saksun, Tjornuvik, Gjogv/Eysturoy if not already visited, and optional Nolsoy or Sandoy."

      base_attractions:
        - id: torshavn_old_town_tinganes
          name: Torshavn Old Town and Tinganes
          priority: highly_recommended
          type: town_walk_culture
          visit_duration_hours: 2
          drive_time_minutes: 0
          coordinates:
            lat: 62.0097
            lon: -6.7716
          visit_strategy:
            primary_base: base_3
            notes: "Good low-effort activity and useful for bad weather or arrival/departure timing."

        - id: kirkjubour
          name: Kirkjubour
          priority: highly_recommended
          type: historic_village
          visit_duration_hours: 2
          drive_time_minutes: 20
          coordinates:
            lat: 61.9561
            lon: -6.7925
          visit_strategy:
            primary_base: base_3
            notes: "Historic village near Torshavn with cathedral ruins and old farm buildings."

        - id: saksun
          name: Saksun
          priority: must_do
          type: village_lagoon_landscape
          visit_duration_hours: 2
          drive_time_minutes: 55
          coordinates:
            lat: 62.2480
            lon: -7.1760
          visit_strategy:
            primary_base: base_3
            secondary_opportunity:
              - transfer_base_1_to_base_2
            notes: "One of the most beautiful village settings in the islands. Best with atmospheric weather but avoid unsafe tides near the lagoon."

        - id: tjornuvik
          name: Tjornuvik
          priority: highly_recommended
          type: village_beach_viewpoint
          visit_duration_hours: 1.5
          drive_time_minutes: 60
          coordinates:
            lat: 62.2890
            lon: -7.1470
          visit_strategy:
            primary_base: base_3
            secondary_opportunity:
              - transfer_base_1_to_base_2
            notes: "Beautiful valley village with beach and views toward Risin og Kellingin."

        - id: gjogv
          name: Gjogv
          priority: must_do
          type: village_gorge_walk
          visit_duration_hours: 2
          drive_time_minutes: 60
          coordinates:
            lat: 62.3240
            lon: -6.9400
          visit_strategy:
            primary_base: base_3
            secondary_opportunity:
              - transfer_base_2_to_base_3
            notes: "Classic village with natural gorge harbour and short walks."

        - id: funningur
          name: Funningur
          priority: highly_recommended
          type: village_fjord_view
          visit_duration_hours: 1
          drive_time_minutes: 55
          coordinates:
            lat: 62.2870
            lon: -6.9650
          visit_strategy:
            primary_base: base_3
            secondary_opportunity:
              - transfer_base_2_to_base_3
            notes: "Good scenic pair with Gjogv and Eidi."

        - id: eidi_and_risin_kellingin
          name: Eidi and Risin og Kellingin Viewpoint
          priority: highly_recommended
          type: sea_stack_viewpoint
          visit_duration_hours: 1
          drive_time_minutes: 50
          coordinates:
            lat: 62.2990
            lon: -7.0920
          visit_strategy:
            primary_base: base_3
            secondary_opportunity:
              - transfer_base_2_to_base_3
            notes: "Easy viewpoint toward the famous sea stacks."

        - id: vestmanna_sea_cliffs
          name: Vestmanna Sea Cliffs Boat Trip
          priority: optional_paid_activity
          type: boat_trip_sea_cliffs
          visit_duration_hours: 2.5
          drive_time_minutes: 40
          coordinates:
            lat: 62.1550
            lon: -7.1660
          visit_strategy:
            primary_base: base_3
            secondary_opportunity:
              - transfer_base_1_to_base_2
            notes: "Classic boat trip, highly weather-dependent. Good optional paid activity if you do not choose Mykines or Drangarnir."

        - id: nolsoy_day_trip
          name: Nolsoy Day Trip
          priority: if_time
          type: short_island_ferry_walk
          visit_duration_hours: 4
          drive_time_minutes: 0
          coordinates:
            lat: 62.0090
            lon: -6.6660
          visit_strategy:
            primary_base: base_3
            notes: "Short ferry from Torshavn, useful as a lighter island day."

        - id: sandoy_day_trip
          name: Sandoy Day Trip
          priority: if_time
          type: island_drive_villages_beaches
          visit_duration_hours: 5
          drive_time_minutes: 40
          coordinates:
            lat: 61.8420
            lon: -6.8290
          visit_strategy:
            primary_base: base_3
            notes: "Now more accessible via subsea tunnel. Good if weather in the north is poor or you want a calmer island day."

      departure_day_candidates:
        route_to: vagar_airport
        note: "On departure day, keep enough time for tunnel driving and airport logistics. If the flight is late, revisit Vagar or Torshavn rather than planning a ferry."
        candidates:
          - attraction_ref: torshavn_old_town_tinganes
          - external_stop_ref: gasadalur_if_missed

  transfer_routes:

    - id: transfer_vagar_airport_to_base_1
      from: vagar_airport
      to: base_1
      description: Arrival at Vagar Airport and short transfer to Sorvagur/Gasadalur area
      estimated_direct_drive_hours: 0.25
      planning_note: "Very short transfer. Good for a gentle arrival day with Mulafossur or Bour if weather allows."
      max_recommended_major_stops: 1
      en_route_candidates:
        - attraction_ref: mulafossur_waterfall
          priority: must_do
          type: waterfall_village_viewpoint
          stop_duration_hours: 1.5
          transfer_role: candidate
        - attraction_ref: bour_village
          priority: highly_recommended
          type: village_viewpoint
          stop_duration_hours: 1
          transfer_role: candidate

    - id: transfer_base_1_to_base_2
      from: base_1
      to: base_2
      description: Vagar to Klaksvik / Northern Islands via Streymoy and Eysturoy tunnels
      estimated_direct_drive_hours: 1.5
      planning_note: "Short enough to include one or two central/northern stops, but do not use the Kalsoy ferry on the same transfer day unless everything is very smooth."
      max_recommended_major_stops: 2
      en_route_candidates:
        - attraction_ref: saksun
          priority: must_do
          type: village_lagoon_landscape
          stop_duration_hours: 2
          transfer_role: candidate
        - attraction_ref: tjornuvik
          priority: highly_recommended
          type: village_beach_viewpoint
          stop_duration_hours: 1.5
          transfer_role: candidate
        - id: eysturoyartunnilin
          name: Eysturoyartunnilin Undersea Roundabout
          priority: if_time
          type: tunnel_route_feature
          stop_duration_hours: 0
          coordinates:
            lat: 62.1300
            lon: -6.8000
          transfer_role: route_segment
          planning_note: "Not a sightseeing stop, but a memorable route feature if the chosen route uses the tunnel."

    - id: transfer_base_2_to_base_3
      from: base_2
      to: base_3
      description: Klaksvik / Northern Islands to Torshavn / Central Streymoy
      estimated_direct_drive_hours: 1.25
      planning_note: "Good transfer for Eysturoy villages such as Gjogv, Funningur and Eidi."
      max_recommended_major_stops: 2
      en_route_candidates:
        - attraction_ref: gjogv
          priority: must_do
          type: village_gorge_walk
          stop_duration_hours: 2
          transfer_role: candidate
        - attraction_ref: funningur
          priority: highly_recommended
          type: village_fjord_view
          stop_duration_hours: 1
          transfer_role: add_on
        - attraction_ref: eidi_and_risin_kellingin
          priority: highly_recommended
          type: sea_stack_viewpoint
          stop_duration_hours: 1
          transfer_role: candidate

    - id: transfer_base_3_to_vagar_airport
      from: base_3
      to: vagar_airport
      description: Torshavn / Central Streymoy to Vagar Airport
      estimated_direct_drive_hours: 0.75
      planning_note: "Keep this flexible. Do not plan weather-dependent ferries or long hikes before a flight."
      max_recommended_major_stops: 1
      en_route_candidates:
        - id: gasadalur_if_missed
          name: Gasadalur / Mulafossur if missed earlier
          priority: highly_recommended
          type: backup_viewpoint
          stop_duration_hours: 1.5
          coordinates:
            lat: 62.1049
            lon: -7.4347
          transfer_role: backup_only
        - attraction_ref: torshavn_old_town_tinganes
          priority: highly_recommended
          type: town_walk_culture
          stop_duration_hours: 1.5
          transfer_role: backup_only

  airport:
    id: vagar_airport
    name: Vagar Airport
    coordinates:
      lat: 62.0636
      lon: -7.2772

  paid_activity_preferences:
    intended_paid_activities:
      - mykines_day_trip
    possible_second_paid_activity:
      - vestmanna_sea_cliffs
      - drangarnir_tindholmur
    planning_note: "Choose Mykines only if puffins, ferry logistics and weather make sense. If Mykines is not possible, Vestmanna sea cliffs or Drangarnir/Tindholmur are strong alternatives."

  excluded_or_future_trip_options:
    suduroy:
      reason: "Beautiful and more remote, but the ferry from Torshavn takes significant time. Better if the trip is extended to 12-14 days or if another base is added."
    full_18_island_coverage:
      reason: "Not realistic or useful for a family trip focused on quality hikes and weather flexibility."

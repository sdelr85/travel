      type: scenic_hiking_area
      visit_duration_hours: 3
      drive_time_minutes: 15
      coordinates:
        lat: 56.6675
        lon: -4.9838
      visit_strategy:
        notes: "Klassiek Glencoe-uitkijkpunt en valleiwandelingen."

    - id: glen_etive
      name: Glen Etive
      priority: highly_recommended
      type: scenic_drive
      visit_duration_hours: 2
      drive_time_minutes: 25
      coordinates:
        lat: 56.5600
        lon: -4.9300
      visit_strategy:
        notes: "Schilderachtige zijglen ten zuiden van Glencoe, gebruikt in Skyfall."

    - id: glenfinnan_viaduct
      name: Glenfinnan-viaduct
      priority: must_do
      type: harry_potter_highlight
      visit_duration_hours: 2
      drive_time_minutes: 35
      coordinates:
        lat: 56.8743
        lon: -5.4318
      visit_strategy:
        notes: "Bekijk de dienstregeling van de Jacobitische stoomtrein voor een bezoek op tijd."

    - id: glenfinnan_monument
      name: Glenfinnan-monument

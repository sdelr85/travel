  excluded_from_this_trip:
  - Glasgow
  - John o Groats
  - Full NC500 loop
  - Outer Hebrides
  rationale:
    glasgow: "Nice city but less aligned with the family's interests in nature, hiking and scenery."
    far_north: "Can be added in a future trip, but would increase driving substantially."
    edinburgh: "Strongly recommended for city variety, culture and one of Europe's most beautiful historic centres."

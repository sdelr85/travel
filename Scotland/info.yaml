trip:
  country: Scotland
  overview:
    rank: 15
    summary: "14-daagse familie-autoreis vanuit België via nachtboot naar Newcastle, gericht op de Hooglanden, het eiland Skye en Edinburgh."
    summary_reason: >-
      Schotland biedt iets wat de andere Europese bestemmingen op deze lijst niet hebben — een spookachtige, problematische kwaliteit die voortkomt uit eeuwenoude kastelen die half door mist worden verzwolgen, eenbaanswegen die tussen lochs door slingeren en de wilde afgeslegenheid van Skye en de North Coast 500. Bereikbaar via nachtboot vanuit België afkomstig van het beste Hooglanden-scenerie met whiskyland, eilandlandschappen en een gevoel van werkelijk episch favoriete zonder West-Europa te zijn verdwenen.
    transport: "🚗 Eigen auto + ⛴ Nachtveerboot naar Newcastle"
    duration_days: 14
    travel_style: "Familiereis per veerboot"
    highlights:
    - Glencoe en het Glenfinnan Viaduct
    - Eiland Skye (Storr, Quiraing, Fairy Pools)
    - Kasteel Eilean Donan
    - Bealach na Bà en Torridon
    - Assynt (Stac Pollaidh, strand Achmelvich)
    - Edinburgh
    cost:
      couple:
        eur_range: "€3,000 - €6,000"
      family:
        eur_range: "€5,000 - €9,000"
      relative_costs: "low"
      assumptions:
      - Middenklasse accommodaties
      - Hoogseizoen zomer
      - Vluchten/autohuur inbegrepen (indien relevant)
      - Normaal restaurantgebruik
      - Beperkte betaalde excursies (1-2 per basis)
  transport_constraints:
    ferry_to_scotland:
      required: true
      route: Amsterdam/IJmuiden to Newcastle
    return_ferry:
      required: true
      route: Newcastle to Amsterdam/IJmuiden
    additional_island_ferries:
      allowed: optional

  priority_definitions:
    must_do:
      score: 4
    highly_recommended:
      score: 3
    if_time:
      score: 2
    optional_paid_activity:
      score: 1

  lodging_locations:

  - id: base_1
    name: Glencoe/Fort William
    region: Westelijke Hooglanden
    stay_nights: 2

trip:
  country: New Zealand

  overview:
    rank: 1

    summary: >
      24-daagse familie-autoreis door zowel het Noordeiland als het Zuideiland
      van Nieuw-Zeeland, gericht op bergen, vulkanen, geothermische landschappen,
      fjorden, wildlife, meren, wandelen en avontuur.

    summary_reason: >
      Nieuw-Zeeland is de enige plek op aarde waar één enkele autoreis je meeneemt van actieve geothermische
      velden en gloeiende grotten naar de meest dramatische fjorden van het zuidelijk halfrond, langs gletsjers
      die bijna tot zeeniveau reiken en door bergen die lijken alsof ze ontworpen zijn voor een fantasyfilm.
      Anders dan elke andere bestemming op deze lijst houdt de verscheidenheid nooit op — om de twee uur
      heruitvindt het landschap zich volledig, en de combinatie van Milford Sound, de Zuidelijke Alpen,
      Tongariro en Abel Tasman maakt het de meest complete natuurreis ter wereld.

    transport: "✈ Plane + 🚗 Rental car + ✈ domestic flight"

    duration_days: 24
    duration_nights: 23

    travel_style: Fly-in family self-drive

    highlights:
      - Tongariro Alpine Crossing
      - Geothermisch gebied Rotorua
      - Hobbiton
      - Cathedral Cove
      - Mount Cook
      - Hooker Valley Track
      - Wanaka
      - Roys Peak
      - Milford Sound
      - Fjordland
      - Queenstown
      - Glenorchy
      - Walvissen bij Kaikōura

    cost:
      couple:
        eur_range: "€8,000 - €12,000"
      family:
        eur_range: "€14,000 - €22,000"
      relative_costs: "very_high"
      assumptions:
        - "Mid-range accommodations"
        - "Peak summer season"
        - "Flights/Car rental included (if relevant)"
        - "Normal restaurant usage"
        - "Limited paid excursions (1-2 per base)"

  direction: north_island_then_south_island

  duration:

    days: 24
    nights: 23

    base_locations: 8

    recommended_base_split:

